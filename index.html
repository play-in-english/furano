<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Galaxy Alphabet Quiz</title>
<style>
/* ============================================================
   ALPHABET LISTENING QUIZ — STYLES
   ============================================================
   Galaxy / night-sky theme. Structure:
   1. Tokens (colors, fonts, spacing)
   2. Background (sky, stars, nebula)
   3. Layout & shell
   4. Screens (start / game / results)
   5. Components (buttons, progress trail, feedback)
   6. Responsive
   7. Motion / accessibility
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap');

/* ---------- 1. Tokens ---------- */
:root {
  --sky-deep: #05060f;
  --sky-navy: #0b0e2b;
  --sky-navy-2: #131947;
  --nebula-violet: #7c5cff;
  --nebula-pink: #ff6fb0;
  --star-gold: #ffd966;
  --comet-teal: #4fe3c1;
  --ink-light: #f4f2ff;
  --ink-soft: #c7c9ec;
  --success: #4fe3c1;
  --success-glow: rgba(79, 227, 193, 0.45);
  --error: #ff6f91;
  --error-glow: rgba(255, 111, 145, 0.45);
  --card-bg: rgba(19, 25, 71, 0.72);
  --card-border: rgba(255, 255, 255, 0.09);

  --font-display: "Baloo 2", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Trebuchet MS", sans-serif;

  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;

  --shadow-soft: 0 20px 60px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
}

body {
  margin: 0;
  /* Fallbacks first, then modern dynamic-viewport units so the layout
     fits the ACTUAL visible area on phones/tablets — accounting for
     browser chrome (address bars, home indicator) and updating live
     when a window is resized, rotated, or toggled to fullscreen. */
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;
  font-family: var(--font-body);
  color: var(--ink-light);
  background: var(--sky-deep);
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  /* Keep content clear of iPhone notches / home indicator / Android
     gesture bars in any orientation, while never going below 16px. */
  padding: max(16px, env(safe-area-inset-top))
           max(16px, env(safe-area-inset-right))
           max(16px, env(safe-area-inset-bottom))
           max(16px, env(safe-area-inset-left));
}

/* ---------- 2. Background: sky, stars, nebula ---------- */
.sky {
  position: fixed;
  inset: 0;
  z-index: -3;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(124, 92, 255, 0.16), transparent 55%),
    radial-gradient(ellipse at 82% 78%, rgba(255, 111, 176, 0.12), transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(79, 227, 193, 0.08), transparent 60%),
    linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-navy) 55%, #0a0d2a 100%);
}

/* soft drifting nebula clouds, purely decorative */
.nebula {
  position: fixed;
  inset: -10%;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(600px 400px at 15% 25%, rgba(124, 92, 255, 0.14), transparent 60%),
    radial-gradient(500px 380px at 85% 20%, rgba(255, 111, 176, 0.10), transparent 60%),
    radial-gradient(700px 500px at 60% 90%, rgba(79, 227, 193, 0.08), transparent 60%);
  filter: blur(6px);
  animation: driftNebula 50s ease-in-out infinite alternate;
}

@keyframes driftNebula {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-2%, 2%) scale(1.05); }
}

/* star field: layered dots via box-shadow, generated in JS onto this canvas-free layer */
.stars {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  opacity: 0.6;
  animation: twinkle linear infinite;
}

.star.big {
  box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
}

@keyframes twinkle {
  0%, 100% { opacity: var(--min-o, 0.25); transform: scale(1); }
  50%      { opacity: var(--max-o, 0.95); transform: scale(1.25); }
}

@keyframes floatY {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}

/* ---------- 3. Layout & shell ---------- */
.app {
  width: 100%;
  max-width: 640px;
  /* Never let the app shell exceed the visible viewport height,
     whatever device or window size it's viewed at. */
  max-height: 100%;
  display: flex;
  flex-direction: column;
}

.card {
  position: relative;
  width: 100%;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: var(--radius-lg);
  /* Padding scales smoothly with viewport width instead of being a
     fixed pixel value, so the card fits comfortably from a small
     phone up to a wide desktop window. */
  padding: clamp(20px, 4vw, 36px) clamp(18px, 4vw, 32px) clamp(18px, 4vw, 32px);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  animation: floatY 7s ease-in-out infinite;
  /* If content is ever taller than the available space (very short
     landscape windows), scroll inside the card instead of the card
     overflowing off-screen. */
  max-height: min(860px, 96svh, 96dvh);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.screen { display: none; }
.screen.active { display: block; }

h1, h2, h3 {
  font-family: var(--font-display);
  margin: 0;
}

/* ---------- 4. Start Screen ---------- */
.start-screen {
  text-align: center;
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.brand-emoji {
  font-size: 56px;
  filter: drop-shadow(0 0 18px rgba(255, 217, 102, 0.5));
  animation: floatY 4.5s ease-in-out infinite;
}

.title {
  font-size: clamp(28px, 6vw, 38px);
  font-weight: 800;
  line-height: 1.15;
  background: linear-gradient(90deg, var(--star-gold), var(--nebula-pink) 60%, var(--nebula-violet));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  color: var(--ink-soft);
  font-size: 16px;
  font-weight: 600;
  margin-top: 6px;
  line-height: 1.5;
}

.start-illustration {
  margin: 22px 0;
  font-size: 40px;
  display: flex;
  justify-content: center;
  gap: 14px;
}
.start-illustration span { animation: floatY 3.6s ease-in-out infinite; }
.start-illustration span:nth-child(2) { animation-delay: .6s; }
.start-illustration span:nth-child(3) { animation-delay: 1.2s; }

/* ---------- 5. Buttons ---------- */
.btn {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  padding: 16px 32px;
  color: var(--sky-deep);
  background: linear-gradient(135deg, var(--star-gold), #ffb84f);
  box-shadow: 0 0 0 rgba(255, 217, 102, 0), 0 10px 24px rgba(255, 184, 79, 0.28);
  transition: transform .15s ease, box-shadow .25s ease, filter .15s ease;
  /* Removes the ~300ms tap delay and stops accidental double-tap
     zoom on iOS/Android when kids tap quickly. */
  touch-action: manipulation;
}

.btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
.btn:active { transform: translateY(0); }

.btn:focus-visible {
  outline: 3px solid var(--comet-teal);
  outline-offset: 3px;
}

.btn-primary {
  box-shadow: 0 0 24px rgba(255, 217, 102, 0.35), 0 12px 26px rgba(0, 0, 0, 0.35);
}

.btn-secondary {
  background: linear-gradient(135deg, var(--nebula-violet), #5a3fd6);
  color: #fff;
  box-shadow: 0 0 24px rgba(124, 92, 255, 0.35), 0 12px 26px rgba(0, 0, 0, 0.35);
}

.btn-block { width: 100%; }

.btn-lg {
  font-size: 20px;
  padding: 18px 36px;
}

/* Replay audio button */
.audio-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 6px auto 4px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 19px;
  color: var(--sky-deep);
  background: radial-gradient(circle at 30% 30%, #fff, var(--comet-teal) 70%);
  border: none;
  border-radius: 999px;
  padding: 20px 34px;
  cursor: pointer;
  box-shadow: 0 0 0 6px rgba(79, 227, 193, 0.12), 0 14px 30px rgba(79, 227, 193, 0.3);
  transition: transform .15s ease, box-shadow .2s ease;
}
.audio-btn:hover { transform: scale(1.03); }
.audio-btn:active { transform: scale(0.98); }
.audio-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

.audio-btn .speaker-icon {
  font-size: 24px;
  animation: pulseIcon 1.6s ease-in-out infinite;
}
@keyframes pulseIcon {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.audio-btn.playing {
  box-shadow: 0 0 0 10px rgba(79, 227, 193, 0.18), 0 14px 30px rgba(79, 227, 193, 0.45);
}

/* ---------- Game screen ---------- */
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--ink-soft);
  font-size: 14px;
  letter-spacing: .02em;
}

.pill {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.09);
  padding: 6px 14px;
  border-radius: 999px;
}

.pill.score-pill { color: var(--star-gold); }

/* Constellation progress trail — the signature element:
   each answered question lights up a star on the trail the
   rocket travels along toward the finish. */
.constellation {
  position: relative;
  height: 54px;
  margin: 4px 0 22px;
}

.constellation svg { width: 100%; height: 100%; display: block; }

.constellation-line {
  fill: none;
  stroke: rgba(255, 255, 255, 0.14);
  stroke-width: 2;
  stroke-dasharray: 4 6;
}

.constellation-node {
  fill: rgba(255, 255, 255, 0.2);
  stroke: rgba(255, 255, 255, 0.35);
  stroke-width: 1;
  transition: fill .3s ease, stroke .3s ease, r .3s ease;
}

.constellation-node.done {
  fill: var(--star-gold);
  stroke: var(--star-gold);
  filter: drop-shadow(0 0 6px rgba(255, 217, 102, 0.9));
}

.constellation-node.wrong-node {
  fill: var(--error);
  stroke: var(--error);
  filter: drop-shadow(0 0 6px rgba(255, 111, 145, 0.9));
}

.constellation-node.current {
  fill: var(--comet-teal);
  stroke: var(--comet-teal);
  filter: drop-shadow(0 0 8px rgba(79, 227, 193, 0.9));
}

.rocket {
  position: absolute;
  top: -6px;
  font-size: 22px;
  transform: translateX(-50%) rotate(90deg);
  transition: left .5s cubic-bezier(.4,1.4,.5,1);
  filter: drop-shadow(0 0 8px rgba(255, 217, 102, 0.7));
}

.prompt {
  text-align: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  color: var(--ink-soft);
  margin: 4px 0 18px;
}

.options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 16px;
  margin-bottom: 8px;
}

.option-btn {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(32px, 8vw, 42px);
  color: var(--ink-light);
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
  border: 2px solid rgba(255, 255, 255, 0.14);
  border-radius: var(--radius-md);
  padding: clamp(14px, 3vh, 22px) 10px;
  min-height: 44px; /* comfortable tap target on all touch devices */
  cursor: pointer;
  transition: transform .15s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
  touch-action: manipulation;
}

.option-btn:hover:not(:disabled) {
  transform: translateY(-3px);
  border-color: var(--comet-teal);
  box-shadow: 0 0 20px rgba(79, 227, 193, 0.25);
}

.option-btn:focus-visible {
  outline: 3px solid var(--comet-teal);
  outline-offset: 3px;
}

.option-btn:disabled { cursor: default; }

.option-btn.correct {
  background: linear-gradient(160deg, rgba(79, 227, 193, 0.35), rgba(79, 227, 193, 0.12));
  border-color: var(--success);
  box-shadow: 0 0 26px var(--success-glow);
  animation: pop .35s ease;
}

.option-btn.incorrect {
  background: linear-gradient(160deg, rgba(255, 111, 145, 0.35), rgba(255, 111, 145, 0.12));
  border-color: var(--error);
  box-shadow: 0 0 26px var(--error-glow);
  animation: shake .4s ease;
}

.option-btn.dimmed { opacity: 0.45; }

@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.feedback {
  min-height: 34px;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 20px;
  margin: 10px 0 4px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .25s ease, transform .25s ease;
}

.feedback.show { opacity: 1; transform: translateY(0); }
.feedback.correct-text { color: var(--success); }
.feedback.incorrect-text { color: var(--error); }

.next-wrap {
  display: flex;
  justify-content: center;
  margin-top: 14px;
  min-height: 60px;
}

/* ---------- Results screen ---------- */
.results-screen { text-align: center; }

.results-emoji {
  font-size: 60px;
  margin-bottom: 6px;
  animation: floatY 4s ease-in-out infinite;
}

.results-score {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(30px, 7vw, 40px);
  margin: 6px 0 4px;
  background: linear-gradient(90deg, var(--star-gold), var(--comet-teal));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.results-msg {
  color: var(--ink-soft);
  font-weight: 700;
  margin-bottom: 22px;
}

.results-stars {
  font-size: 30px;
  letter-spacing: 6px;
  margin: 14px 0 24px;
}

/* ---------- 6. Responsive ---------- */

/* Phones (portrait) — iPhone SE through Pro Max, small Android phones */
@media (max-width: 480px) {
  .card { border-radius: 22px; }
  .options-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .audio-btn { padding: 14px 24px; font-size: 17px; }
  .brand-emoji { font-size: 46px; }
  .start-illustration { font-size: 32px; margin: 16px 0; }
}

/* Tablets — iPad portrait/landscape and similarly sized Android tablets */
@media (min-width: 600px) and (max-width: 1024px) {
  .app { max-width: 560px; }
}

/* Short viewports — phones in landscape, minimized/split-screen desktop
   windows, or fullscreen on a small display. Trims vertical space so
   everything fits without the card overflowing the screen. */
@media (max-height: 560px) {
  .card { animation: none; } /* stop the float bob so it doesn't fight with scrolling */
  .brand-emoji { font-size: 36px; }
  .title { font-size: clamp(22px, 5vw, 30px); }
  .subtitle { font-size: 14px; margin-top: 4px; }
  .start-illustration { display: none; }
  .audio-btn { padding: 12px 22px; font-size: 16px; }
  .option-btn { font-size: clamp(24px, 6vw, 34px); }
  .constellation { height: 40px; margin-bottom: 14px; }
  .results-emoji { font-size: 40px; }
}

/* Very short viewports — e.g. a small phone in landscape */
@media (max-height: 400px) {
  .card { padding-top: 14px; padding-bottom: 14px; }
  .brand { gap: 4px; }
  .prompt { margin: 2px 0 10px; font-size: 15px; }
}

/* ---------- 7. Motion & accessibility ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}

</style>
</head>
<body>

  <!-- decorative background layers (star field generated in the game-logic <script> below) -->
  <div class="sky"></div>
  <div class="nebula"></div>
  <div class="stars" id="starField" aria-hidden="true"></div>

  <main class="app">
    <div class="card">

      <!-- ============================================================
           START SCREEN
           ============================================================ -->
      <section id="startScreen" class="screen active start-screen">
        <div class="brand">
          <div class="brand-emoji" aria-hidden="true">🚀</div>
          <h1 class="title">Galaxy Alphabet Quiz</h1>
        </div>
        <p class="subtitle">Blast off, listen carefully, and catch<br>the letter sounds among the stars!</p>
        <div class="start-illustration" aria-hidden="true">
          <span>⭐</span><span>🪐</span><span>✨</span>
        </div>
        <button id="startBtn" class="btn btn-primary btn-lg btn-block">🚀 Start Mission</button>
      </section>

      <!-- ============================================================
           GAME SCREEN
           ============================================================ -->
      <section id="gameScreen" class="screen" aria-live="polite">
        <div class="game-header">
          <span class="pill" id="questionCounter">Question 1 / 7</span>
          <span class="pill score-pill" id="scoreCounter">Score: 0 / 0</span>
        </div>

        <!-- Constellation progress trail (signature visual element) -->
        <div class="constellation" id="constellation" aria-hidden="true"></div>

        <p class="prompt">Which letter did you hear?</p>

        <button id="playAudioBtn" class="audio-btn" type="button" aria-label="Play the letter sound">
          <span class="speaker-icon" aria-hidden="true">🔊</span>
          <span>Play Sound</span>
        </button>

        <!-- hidden native audio element the JS controls -->
        <audio id="letterAudio" preload="none"></audio>

        <div class="options-grid" id="optionsGrid" role="group" aria-label="Answer choices"></div>

        <p class="feedback" id="feedback" role="status"></p>

        <div class="next-wrap">
          <button id="nextBtn" class="btn btn-secondary" style="display:none;">Next →</button>
        </div>
      </section>

      <!-- ============================================================
           RESULTS SCREEN
           ============================================================ -->
      <section id="resultsScreen" class="screen results-screen">
        <div class="results-emoji" aria-hidden="true">🎉</div>
        <h2>Great Job, Space Explorer!</h2>
        <p class="results-score" id="resultsScore">0 / 7 Correct!</p>
        <p class="results-msg" id="resultsMsg"></p>
        <div class="results-stars" id="resultsStars" aria-hidden="true"></div>
        <button id="playAgainBtn" class="btn btn-primary btn-lg btn-block">🔄 Play Again</button>
      </section>

    </div>
  </main>

  <!-- ============================================================
       QUESTION BANK — edit the array below to add/remove/change
       questions. See the comment block inside for full instructions.
       ============================================================ -->
  <script>
/* ============================================================
   ALPHABET LISTENING QUIZ — QUESTION BANK
   ============================================================
   This block holds ALL 50 questions. Edit the QUESTION_BANK array
   below whenever you want to add, remove, or change questions. You
   never need to touch the game-logic <script> further down to
   update quiz content.

   HOW TO ADD YOUR AUDIO FILES:
   1. Record or export a short clip of a letter SOUND (not the
      letter name, e.g. the /f/ sound, not "eff").
   2. Save it as an .mp3 file inside the /audio folder.
   3. Name it to match the "audio" path below (question01.mp3,
      question02.mp3, ... question50.mp3) — or change the path
      to whatever filename you used.

   HOW TO EDIT A QUESTION:
   - audio          -> path to the mp3 file for this question
   - correctAnswer  -> the single correct letter (A-Z)
   - options        -> array of letters shown as buttons,
                       MUST include correctAnswer plus one or
                       more incorrect letters. You can add a
                       3rd or 4th option if you want more
                       choices for a harder question.

   HOW TO ADD A NEW QUESTION:
   - Copy one block below, give it a unique "id", point
     "audio" at a new mp3 file, and set correctAnswer/options.

   HOW TO CHANGE HOW MANY QUESTIONS PLAY PER GAME:
   - That setting lives in the game-logic <script> further down this
     file, near the top, in a constant called QUESTIONS_PER_GAME.
     This block only holds the pool of 50 questions that games are
     randomly drawn from.
   ============================================================ */

const QUESTION_BANK = [
  {
    id: 1,
    audio: "audio/question01.mp3",
    correctAnswer: "A",
    options: ["H", "A"]
  },
  {
    id: 2,
    audio: "audio/question02.mp3",
    correctAnswer: "B",
    options: ["B", "V"]
  },
  {
    id: 3,
    audio: "audio/question03.mp3",
    correctAnswer: "C",
    options: ["K", "C"]
  },
  {
    id: 4,
    audio: "audio/question04.mp3",
    correctAnswer: "D",
    options: ["B", "D"]
  },
  {
    id: 5,
    audio: "audio/question05.mp3",
    correctAnswer: "E",
    options: ["E", "I"]
  },
  {
    id: 6,
    audio: "audio/question06.mp3",
    correctAnswer: "F",
    options: ["S", "F"]
  },
  {
    id: 7,
    audio: "audio/question07.mp3",
    correctAnswer: "G",
    options: ["J", "G"]
  },
  {
    id: 8,
    audio: "audio/question08.mp3",
    correctAnswer: "H",
    options: ["A", "H"]
  },
  {
    id: 9,
    audio: "audio/question09.mp3",
    correctAnswer: "I",
    options: ["I", "E"]
  },
  {
    id: 10,
    audio: "audio/question10.mp3",
    correctAnswer: "J",
    options: ["J", "G"]
  },
  {
    id: 11,
    audio: "audio/question11.mp3",
    correctAnswer: "K",
    options: ["Q", "K"]
  },
  {
    id: 12,
    audio: "audio/question12.mp3",
    correctAnswer: "L",
    options: ["L", "R"]
  },

  <!-- ============================================================
       GAME LOGIC — you shouldn't need to edit this to change quiz
       content (that's all in the QUESTION_BANK above). Settings you
       CAN tweak are called out near the top (QUESTIONS_PER_GAME,
       STAR_COUNT).
       ============================================================ -->
  <script>
/* ============================================================
   ALPHABET LISTENING QUIZ — GAME LOGIC
   ============================================================
   You generally should NOT need to edit this section to update
   quiz content — that all lives in the QUESTION_BANK <script>
   above.

   Settings you CAN safely change below:
   - QUESTIONS_PER_GAME : how many questions are played each round
   - STAR_COUNT         : how many background stars are drawn
   ============================================================ */

const QUESTIONS_PER_GAME = 7; // <-- change this to play more/fewer questions per game
const STAR_COUNT = 90;        // <-- change this to make the sky sparser/denser

/* ------------------------------------------------------------
   STATE
   ------------------------------------------------------------ */
const state = {
  roundQuestions: [], // the QUESTIONS_PER_GAME questions chosen for this round
  currentIndex: 0,
  score: 0,
  answeredCurrent: false,
  results: [] // true/false per question, in order, for the constellation trail
};

/* ------------------------------------------------------------
   DOM REFERENCES
   ------------------------------------------------------------ */
const screens = {
  start: document.getElementById('startScreen'),
  game: document.getElementById('gameScreen'),
  results: document.getElementById('resultsScreen')
};

const startBtn = document.getElementById('startBtn');
const playAgainBtn = document.getElementById('playAgainBtn');
const playAudioBtn = document.getElementById('playAudioBtn');
const letterAudio = document.getElementById('letterAudio');
const optionsGrid = document.getElementById('optionsGrid');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const questionCounter = document.getElementById('questionCounter');
const scoreCounter = document.getElementById('scoreCounter');
const constellationEl = document.getElementById('constellation');
const resultsScore = document.getElementById('resultsScore');
const resultsMsg = document.getElementById('resultsMsg');
const resultsStars = document.getElementById('resultsStars');
const starField = document.getElementById('starField');

/* ------------------------------------------------------------
   BACKGROUND STAR FIELD
   Purely decorative — generates STAR_COUNT twinkling dots.
   ------------------------------------------------------------ */
function buildStarField() {
  starField.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < STAR_COUNT; i++) {
    const star = document.createElement('div');
    const size = Math.random() < 0.15 ? (Math.random() * 2 + 2.5) : (Math.random() * 1.5 + 1);
    const isBig = size > 3;
    star.className = 'star' + (isBig ? ' big' : '');
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    const duration = (Math.random() * 3 + 2.5).toFixed(2);
    const delay = (Math.random() * 4).toFixed(2);
    star.style.setProperty('--min-o', (Math.random() * 0.25 + 0.1).toFixed(2));
    star.style.setProperty('--max-o', (Math.random() * 0.4 + 0.6).toFixed(2));
    star.style.animationDuration = duration + 's';
    star.style.animationDelay = delay + 's';
    frag.appendChild(star);
  }
  starField.appendChild(frag);
}

/* ------------------------------------------------------------
   QUESTION SELECTION
   Picks QUESTIONS_PER_GAME unique random questions from the
   50-question bank using a Fisher–Yates shuffle, so both the
   selection AND the order are freshly randomized every game.
   ------------------------------------------------------------ */
function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickRoundQuestions() {
  const shuffledBank = shuffle(QUESTION_BANK);
  return shuffledBank.slice(0, QUESTIONS_PER_GAME);
}

/* ------------------------------------------------------------
   SCREEN NAVIGATION
   ------------------------------------------------------------ */
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* ------------------------------------------------------------
   CONSTELLATION PROGRESS TRAIL
   Draws a dashed path with one star-node per question; nodes
   light up gold (correct) or pink (incorrect) as answered, and
   a little rocket travels along the path.
   ------------------------------------------------------------ */
function renderConstellation() {
  const total = state.roundQuestions.length;
  const width = 600;
  const height = 54;
  const padding = 30;
  const step = total > 1 ? (width - padding * 2) / (total - 1) : 0;
  const y = height / 2;

  let pathD = `M ${padding} ${y}`;
  let nodesSvg = '';

  for (let i = 0; i < total; i++) {
    const x = padding + step * i;
    if (i > 0) pathD += ` L ${x} ${y}`;

    let cls = 'constellation-node';
    if (i < state.results.length) {
      cls += state.results[i] ? ' done' : ' wrong-node';
    } else if (i === state.currentIndex) {
      cls += ' current';
    }
    const r = i === state.currentIndex && i >= state.results.length ? 8 : 6;
    nodesSvg += `<circle class="${cls}" cx="${x}" cy="${y}" r="${r}"></circle>`;
  }

  constellationEl.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
      <path class="constellation-line" d="${pathD}"></path>
      ${nodesSvg}
    </svg>
    <div class="rocket" id="rocketIcon" aria-hidden="true">🚀</div>
  `;

  // position rocket over current node using percentage of width
  const rocket = document.getElementById('rocketIcon');
  const progressIndex = Math.min(state.currentIndex, total - 1);
  const xPercent = total > 1
    ? ((padding + step * progressIndex) / width) * 100
    : 50;
  rocket.style.left = xPercent + '%';
}

/* ------------------------------------------------------------
   GAME FLOW
   ------------------------------------------------------------ */
function startGame() {
  state.roundQuestions = pickRoundQuestions();
  state.currentIndex = 0;
  state.score = 0;
  state.results = [];
  showScreen('game');
  renderQuestion();
}

function renderQuestion() {
  state.answeredCurrent = false;
  const total = state.roundQuestions.length;
  const q = state.roundQuestions[state.currentIndex];

  questionCounter.textContent = `Question ${state.currentIndex + 1} / ${total}`;
  scoreCounter.textContent = `Score: ${state.score} / ${state.currentIndex}`;

  renderConstellation();

  // reset audio + feedback + next button
  letterAudio.pause();
  letterAudio.currentTime = 0;
  letterAudio.src = q.audio;
  playAudioBtn.classList.remove('playing');
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  nextBtn.style.display = 'none';

  // build answer option buttons (shuffled so the correct answer
  // isn't always in the same position)
  optionsGrid.innerHTML = '';
  const shuffledOptions = shuffle(q.options);
  shuffledOptions.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.type = 'button';
    btn.textContent = letter;
    btn.setAttribute('aria-label', `Answer ${letter}`);
    btn.addEventListener('click', () => handleAnswer(letter, btn, q.correctAnswer));
    optionsGrid.appendChild(btn);
  });

  // autoplay the sound for this question (best effort; browsers may
  // block autoplay, in which case the student just taps Play Sound)
  playCurrentAudio();
}

function playCurrentAudio() {
  playAudioBtn.classList.add('playing');
  const playPromise = letterAudio.play();
  if (playPromise && playPromise.catch) {
    playPromise.catch(() => {
      // Autoplay blocked, or the mp3 file hasn't been added yet.
      // Silently ignore — the student can press "Play Sound" manually.
      playAudioBtn.classList.remove('playing');
    });
  }
  letterAudio.onended = () => playAudioBtn.classList.remove('playing');
}

playAudioBtn.addEventListener('click', () => {
  letterAudio.currentTime = 0;
  playCurrentAudio();
});

function handleAnswer(selectedLetter, btnEl, correctLetter) {
  // Prevent multiple submissions for the same question
  if (state.answeredCurrent) return;
  state.answeredCurrent = true;

  const isCorrect = selectedLetter === correctLetter;
  state.results[state.currentIndex] = isCorrect;

  const allOptionButtons = optionsGrid.querySelectorAll('.option-btn');
  allOptionButtons.forEach(b => {
    b.disabled = true;
    if (b.textContent === correctLetter) {
      b.classList.add('correct');
    } else if (b === btnEl) {
      b.classList.add('incorrect');
    } else {
      b.classList.add('dimmed');
    }
  });

  if (isCorrect) {
    state.score++;
    feedbackEl.textContent = '✓ Correct!';
    feedbackEl.classList.add('correct-text');
  } else {
    feedbackEl.textContent = `✗ Try again! It was "${correctLetter}".`;
    feedbackEl.classList.add('incorrect-text');
  }
  feedbackEl.classList.add('show');

  scoreCounter.textContent = `Score: ${state.score} / ${state.currentIndex + 1}`;
  renderConstellation();

  const total = state.roundQuestions.length;
  nextBtn.textContent = (state.currentIndex + 1 < total) ? 'Next →' : 'See Results →';
  nextBtn.style.display = 'inline-block';
}

nextBtn.addEventListener('click', () => {
  const total = state.roundQuestions.length;
  if (state.currentIndex + 1 < total) {
    state.currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
});

/* ------------------------------------------------------------
   RESULTS SCREEN
   ------------------------------------------------------------ */
function showResults() {
  const total = state.roundQuestions.length;
  resultsScore.textContent = `${state.score} / ${total} Correct!`;

  let message;
  const ratio = state.score / total;
  if (ratio === 1) {
    message = 'Perfect mission — you heard every letter!';
  } else if (ratio >= 0.7) {
    message = 'Awesome listening, space explorer!';
  } else if (ratio >= 0.4) {
    message = 'Nice work! Keep practicing those sounds.';
  } else {
    message = 'Good try! Let\u2019s blast off again and listen closely.';
  }
  resultsMsg.textContent = message;

  const filled = Math.round(ratio * 5);
  resultsStars.textContent = '⭐'.repeat(filled) + '☆'.repeat(5 - filled);

  showScreen('results');
}

/* ------------------------------------------------------------
   EVENT WIRING
   ------------------------------------------------------------ */
startBtn.addEventListener('click', startGame);
playAgainBtn.addEventListener('click', startGame);

/* ------------------------------------------------------------
   INIT
   ------------------------------------------------------------ */
buildStarField();

  </script>
