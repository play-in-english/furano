<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Galaxy Alphabet Quiz</title>
<style>
/* ============================================================
   ALPHABET LISTENING QUIZ — STYLES
   ============================================================
   Galaxy / night-sky theme. Structure:
   1. Tokens (colors, fonts, spacing)
   2. Background (sky, stars, nebula)
   3. Layout & shell
   4. Screens (start / game / results)
   5. Components (buttons, progress trail, feedback)
   6. Responsive
   7. Motion / accessibility
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap');

/* ---------- 1. Tokens ---------- */
:root {
  --sky-deep: #05060f;
  --sky-navy: #0b0e2b;
  --sky-navy-2: #131947;
  --nebula-violet: #7c5cff;
  --nebula-pink: #ff6fb0;
  --star-gold: #ffd966;
  --comet-teal: #4fe3c1;
  --ink-light: #f4f2ff;
  --ink-soft: #c7c9ec;
  --success: #4fe3c1;
  --success-glow: rgba(79, 227, 193, 0.45);
  --error: #ff6f91;
  --error-glow: rgba(255, 111, 145, 0.45);

  --font-display: "Baloo 2", "Trebuchet MS", sans-serif;
  --font-body: "Nunito", "Trebuchet MS", sans-serif;

  --radius-md: 18px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
}

body {
  margin: 0;
  /* Fallbacks first, then modern dynamic-viewport units so the layout
     fits the ACTUAL visible area on phones/tablets — accounting for
     browser chrome (address bars, home indicator) and updating live
     when a window is resized, rotated, or toggled to fullscreen. */
  min-height: 100vh;
  min-height: 100svh;
  min-height: 100dvh;
  font-family: var(--font-body);
  color: var(--ink-light);
  background: var(--sky-deep);
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  /* Keep content clear of iPhone notches / home indicator / Android
     gesture bars in any orientation, while never going below 16px. */
  padding: max(16px, env(safe-area-inset-top))
           max(16px, env(safe-area-inset-right))
           max(16px, env(safe-area-inset-bottom))
           max(16px, env(safe-area-inset-left));
}

/* ---------- 2. Background: sky, stars, nebula ---------- */
.sky {
  position: fixed;
  inset: 0;
  z-index: -3;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(124, 92, 255, 0.16), transparent 55%),
    radial-gradient(ellipse at 82% 78%, rgba(255, 111, 176, 0.12), transparent 50%),
    radial-gradient(ellipse at 50% 100%, rgba(79, 227, 193, 0.08), transparent 60%),
    linear-gradient(180deg, var(--sky-deep) 0%, var(--sky-navy) 55%, #0a0d2a 100%);
}

/* soft drifting nebula clouds, purely decorative */
.nebula {
  position: fixed;
  inset: -10%;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(600px 400px at 15% 25%, rgba(124, 92, 255, 0.14), transparent 60%),
    radial-gradient(500px 380px at 85% 20%, rgba(255, 111, 176, 0.10), transparent 60%),
    radial-gradient(700px 500px at 60% 90%, rgba(79, 227, 193, 0.08), transparent 60%);
  filter: blur(6px);
  animation: driftNebula 50s ease-in-out infinite alternate;
  transition: opacity .8s ease, filter .8s ease, transform .8s ease;
}

/* Nebula blooms brighter and more saturated during the galaxy-entry
   transition, then settles back down once the quiz appears. */
body.warping .nebula {
  opacity: 1;
  filter: blur(14px) saturate(1.6);
  transform: scale(1.08);
}

@keyframes driftNebula {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(-2%, 2%) scale(1.05); }
}

/* star field: layered dots via box-shadow, generated in JS onto this canvas-free layer */
.stars {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  transition: opacity .5s ease;
}

/* While the hyperspace transition plays, fade the calm twinkling
   field out — the warp canvas takes over the star show. */
body.warping .stars {
  opacity: 0;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  opacity: 0.6;
  animation: twinkle linear infinite;
}

.star.big {
  box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
}

@keyframes twinkle {
  0%, 100% { opacity: var(--min-o, 0.25); transform: scale(1); }
  50%      { opacity: var(--max-o, 0.95); transform: scale(1.25); }
}

/* ---------- 2a. Ambient floating rockets & shooting stars ----------
   Continuous background flourishes — separate from the hyperspace
   warp system entirely. Elements are spawned/removed by app.js on a
   loose random schedule and play throughout the whole site: start
   screen, quiz, and results alike. */
.ambient-layer {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  overflow: hidden;
}

/* A shooting star: a short fading streak (the "extending line" of
   its path) that shoots across the screen at a random angle/spot
   and disappears. The rotate+translateX combo below (with a FIXED
   rotation angle set via --angle) is what makes it travel in a
   straight line at that angle — see spawnShootingStar() in app.js. */
.shooting-star {
  position: absolute;
  height: 2px;
  background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.85) 75%, #fff 100%);
  border-radius: 999px;
  filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.65));
  transform-origin: left center;
  opacity: 0;
  animation-name: shootingStarMove;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

@keyframes shootingStarMove {
  0%   { transform: rotate(var(--angle)) translateX(0); opacity: 0; }
  8%   { opacity: 1; }
  75%  { opacity: 1; }
  100% { transform: rotate(var(--angle)) translateX(var(--distance)); opacity: 0; }
}

/* A slowly drifting rocket emoji. Duration is much longer than a
   shooting star's so it reads as cruising calmly through space
   rather than shooting past. The path is a straight line so the
   --angle (computed from the actual dx/dy in app.js) keeps the
   rocket's nose pointed exactly the way it's travelling. */
.floating-rocket {
  position: absolute;
  opacity: 0;
  filter: drop-shadow(0 0 10px rgba(255, 217, 102, 0.35));
  animation-name: floatingRocketDrift;
  animation-timing-function: ease-in-out;
  animation-fill-mode: forwards;
}

@keyframes floatingRocketDrift {
  0%   { transform: translate(0, 0) rotate(var(--angle)); opacity: 0; }
  10%  { opacity: 0.85; }
  90%  { opacity: 0.85; }
  100% { transform: translate(var(--dx), var(--dy)) rotate(var(--angle)); opacity: 0; }
}

/* Pause (rather than hide) ambient flourishes during a hyperspace
   burst so they don't visually compete with the more intense warp
   canvas — they simply resume once the transition finishes. */
body.warping .shooting-star,
body.warping .floating-rocket {
  animation-play-state: paused;
}

@keyframes floatY {
  0%   { transform: translateY(0); }
  50%  { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}

/* ---------- 2b. Galaxy entrance transition ---------- */

/* Full-screen canvas the JS draws the hyperspace star streak
   animation onto. Sits above the calm background layers but below
   the quiz card, and is fully transparent/inert until "active". */
.warp-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity .6s ease;
}

.warp-canvas.active {
  opacity: 1;
}

/* Soft bright bloom that pulses once as the student "arrives" in
   the galaxy, right after the hyperspace burst. */
.galaxy-flash {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(circle at 50% 50%,
      rgba(255, 255, 255, 0.85) 0%,
      rgba(255, 217, 102, 0.45) 22%,
      rgba(124, 92, 255, 0.35) 45%,
      rgba(5, 6, 15, 0) 72%);
}

.galaxy-flash.flash {
  animation: galaxyFlashPulse 1100ms ease-out forwards;
}

@keyframes galaxyFlashPulse {
  0%   { opacity: 0; }
  35%  { opacity: 0.9; }
  100% { opacity: 0; }
}

/* The quiz shell fades/shrinks away as hyperspace begins, then
   fades/grows back in once the galaxy-entry flash has passed. */
.app {
  position: relative;
  z-index: 2;
  transition: opacity .6s ease, transform .6s ease;
  /* No card background anymore, so text needs its own contrast
     against the starfield/nebula. text-shadow is inherited, so this
     one declaration covers every heading, label, and button below. */
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6), 0 1px 3px rgba(0, 0, 0, 0.8);
}

.app.transition-hide {
  opacity: 0;
  transform: scale(0.94);
  pointer-events: none;
}

/* While a hyperspace burst plays (big entrance or a between-question
   hop), the whole app subtly scales up in step with the stars
   rushing outward — so the UI feels like it's traveling with the
   galaxy rather than sitting still on top of it. */
body.warping .app:not(.transition-hide) {
  transform: scale(1.035);
}

/* ---------- 3. Layout & shell ---------- */
.app {
  width: 100%;
  max-width: 640px;
  /* Never let the app shell exceed the visible viewport height,
     whatever device or window size it's viewed at. */
  max-height: 100%;
  display: flex;
  flex-direction: column;
}

.card {
  position: relative;
  width: 100%;
  /* No panel/box here on purpose — content floats directly over the
     galaxy background so it feels like part of the scene rather than
     a UI card sitting on top of it. Text/buttons keep their own
     shadows and solid backgrounds for readability instead. */
  padding: clamp(20px, 4vw, 36px) clamp(18px, 4vw, 32px) clamp(18px, 4vw, 32px);
  animation: floatY 7s ease-in-out infinite;
  /* If content is ever taller than the available space (very short
     landscape windows), scroll instead of clipping off-screen. This
     is a functional safety net only — there's no visible boundary. */
  max-height: min(860px, 96svh, 96dvh);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.screen { display: none; }
.screen.active { display: block; }

h1, h2, h3 {
  font-family: var(--font-display);
  margin: 0;
}

/* ---------- 4. Start Screen ---------- */
.start-screen {
  text-align: center;
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.brand-emoji {
  font-size: 56px;
  filter: drop-shadow(0 0 18px rgba(255, 217, 102, 0.5));
  animation: floatY 4.5s ease-in-out infinite;
}

.title {
  font-size: clamp(28px, 6vw, 38px);
  font-weight: 800;
  line-height: 1.15;
  color: #ffffff;
}

.subtitle {
  color: var(--ink-soft);
  font-size: 16px;
  font-weight: 600;
  margin-top: 6px;
  line-height: 1.5;
}

.start-illustration {
  margin: 22px 0;
  font-size: 40px;
  display: flex;
  justify-content: center;
  gap: 14px;
}
.start-illustration span { animation: floatY 3.6s ease-in-out infinite; }
.start-illustration span:nth-child(2) { animation-delay: .6s; }
.start-illustration span:nth-child(3) { animation-delay: 1.2s; }

/* ---------- 5. Buttons ---------- */
.btn {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  padding: 16px 32px;
  color: var(--sky-deep);
  background: linear-gradient(135deg, var(--star-gold), #ffb84f);
  box-shadow: 0 0 0 rgba(255, 217, 102, 0), 0 10px 24px rgba(255, 184, 79, 0.28);
  transition: transform .15s ease, box-shadow .25s ease, filter .15s ease;
  /* Removes the ~300ms tap delay and stops accidental double-tap
     zoom on iOS/Android when kids tap quickly. */
  touch-action: manipulation;
}

.btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
.btn:active { transform: translateY(0); }

.btn:focus-visible {
  outline: 3px solid var(--comet-teal);
  outline-offset: 3px;
}

.btn-primary {
  box-shadow: 0 0 24px rgba(255, 217, 102, 0.35), 0 12px 26px rgba(0, 0, 0, 0.35);
}

.btn-secondary {
  background: linear-gradient(135deg, var(--nebula-violet), #5a3fd6);
  color: #fff;
  box-shadow: 0 0 24px rgba(124, 92, 255, 0.35), 0 12px 26px rgba(0, 0, 0, 0.35);
}

.btn-block { width: 100%; }

.btn-lg {
  font-size: 20px;
  padding: 18px 36px;
}

/* Replay audio button */
.audio-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 6px auto 4px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 19px;
  color: var(--sky-deep);
  background: radial-gradient(circle at 30% 30%, #fff, var(--comet-teal) 70%);
  border: none;
  border-radius: 999px;
  padding: 20px 34px;
  cursor: pointer;
  box-shadow: 0 0 0 6px rgba(79, 227, 193, 0.12), 0 14px 30px rgba(79, 227, 193, 0.3);
  transition: transform .15s ease, box-shadow .2s ease;
}
.audio-btn:hover { transform: scale(1.03); }
.audio-btn:active { transform: scale(0.98); }
.audio-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

.audio-btn .speaker-icon {
  font-size: 24px;
  animation: pulseIcon 1.6s ease-in-out infinite;
}
@keyframes pulseIcon {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.audio-btn.playing {
  box-shadow: 0 0 0 10px rgba(79, 227, 193, 0.18), 0 14px 30px rgba(79, 227, 193, 0.45);
}

/* ---------- Game screen ---------- */
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--ink-soft);
  font-size: 14px;
  letter-spacing: .02em;
  gap: 10px;
}

.header-group {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0; /* lets pill text truncate/wrap instead of overflowing */
}

.pill {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.09);
  padding: 6px 14px;
  border-radius: 999px;
  white-space: nowrap;
}

.pill.score-pill { color: var(--star-gold); }
.pill.timer-pill { color: var(--comet-teal); }

/* Black hole "return home" button — beside the question counter.
   A dark event horizon with a slowly-spinning swirl of galaxy colors
   for its accretion disk. Clicking it during the game sends the
   student back to the very first screen (see blackholeBtn's click
   handler in app.js). */
.blackhole-btn {
  --bh-size: 34px;
  flex: none;
  width: var(--bh-size);
  height: var(--bh-size);
  padding: 0;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  background:
    radial-gradient(circle at 50% 50%, #000 0 34%, transparent 36%),
    conic-gradient(from 0deg, var(--nebula-violet), var(--star-gold), var(--nebula-pink), var(--comet-teal), var(--nebula-violet));
  box-shadow: 0 0 10px rgba(124, 92, 255, 0.55), 0 0 3px rgba(0, 0, 0, 0.7) inset;
  animation: blackholeSpin 6s linear infinite;
  touch-action: manipulation;
  transition: box-shadow .2s ease, transform .15s ease;
}

.blackhole-btn:hover { transform: scale(1.08); }
.blackhole-btn:active { transform: scale(0.95); }

.blackhole-btn:focus-visible {
  outline: 2px solid var(--comet-teal);
  outline-offset: 3px;
}

.blackhole-btn:disabled {
  cursor: default;
  opacity: 0.6;
}

@keyframes blackholeSpin {
  to { transform: rotate(360deg); }
}

/* Constellation progress trail — the signature element:
   each answered question lights up a star on the trail the
   rocket travels along toward the finish. */
.constellation {
  position: relative;
  height: 54px;
  margin: 4px 0 22px;
}

.constellation svg { width: 100%; height: 100%; display: block; }

.constellation-line {
  fill: none;
  stroke: rgba(255, 255, 255, 0.14);
  stroke-width: 2;
  stroke-dasharray: 4 6;
}

.constellation-node {
  fill: rgba(255, 255, 255, 0.2);
  stroke: rgba(255, 255, 255, 0.35);
  stroke-width: 1;
  transition: fill .3s ease, stroke .3s ease, r .3s ease;
}

.constellation-node.done {
  fill: var(--star-gold);
  stroke: var(--star-gold);
  filter: drop-shadow(0 0 6px rgba(255, 217, 102, 0.9));
}

.constellation-node.wrong-node {
  fill: var(--error);
  stroke: var(--error);
  filter: drop-shadow(0 0 6px rgba(255, 111, 145, 0.9));
}

.constellation-node.current {
  fill: var(--comet-teal);
  stroke: var(--comet-teal);
  filter: drop-shadow(0 0 8px rgba(79, 227, 193, 0.9));
}

.rocket {
  position: absolute;
  top: -6px;
  font-size: 22px;
  transform: translateX(-50%) rotate(90deg);
  transition: left .5s cubic-bezier(.4,1.4,.5,1);
  filter: drop-shadow(0 0 8px rgba(255, 217, 102, 0.7));
}

.prompt {
  text-align: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 17px;
  color: var(--ink-soft);
  margin: 4px 0 18px;
}

/* ---------- Question-to-question galaxy zoom transition ----------
   Wraps the prompt/audio button/options/feedback for one question.
   app.js toggles q-exit / q-enter on this element so each question
   moves the SAME way the hyperspace stars do: the outgoing question
   rushes bigger/brighter and blurs past the viewer (like something
   flying past at warp speed), and the next one starts tiny and far
   away, then zooms up to size as it "arrives" — so the content and
   the starfield feel like one continuous flight rather than a card
   fading in place while the background does its own thing.
   NOTE: the 360ms duration here is referenced by QUESTION_TRANSITION_MS
   in app.js — keep them in sync if you change either one. */
.question-content {
  /* Ease-out: fast at first, settling gently — used when arriving
     (q-enter is removed and it eases back to full size). */
  transition: opacity 360ms cubic-bezier(0.16, 1, 0.3, 1),
              transform 360ms cubic-bezier(0.16, 1, 0.3, 1),
              filter 360ms ease-out;
}

.question-content.q-exit {
  /* Ease-in: starts slow, accelerates away — matches stars
     speeding up as they rush toward the edges of the screen. */
  transition: opacity 320ms cubic-bezier(0.7, 0, 0.84, 0),
              transform 320ms cubic-bezier(0.7, 0, 0.84, 0),
              filter 320ms ease-in;
  opacity: 0;
  transform: scale(1.4);
  filter: blur(5px);
}

/* Used instead of q-exit specifically when leaving via the black
   hole button: content shrinks and spins down to a point and blurs
   away, like it's being pulled in and spaghettified — the opposite
   feel of q-exit's "flying past the camera" look. */
.question-content.q-suck {
  transition: opacity 320ms cubic-bezier(0.55, 0, 1, 0.45),
              transform 320ms cubic-bezier(0.55, 0, 1, 0.45),
              filter 320ms ease-in;
  opacity: 0;
  transform: scale(0.15) rotate(35deg);
  filter: blur(3px);
}

.question-content.q-enter {
  /* Snapped to instantly (no transition) right after the content is
     swapped, so it starts small/far/blurred with nothing to animate
     FROM — then this class is removed a frame later, letting the
     base .question-content transition above ease it up to full size. */
  transition: none;
  opacity: 0;
  transform: scale(0.35) translateY(10px);
  filter: blur(6px);
}

.options-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 16px;
  margin-bottom: 8px;
}

.option-btn {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(32px, 8vw, 42px);
  color: var(--ink-light);
  background: linear-gradient(160deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
  border: 2px solid rgba(255, 255, 255, 0.14);
  border-radius: var(--radius-md);
  padding: clamp(14px, 3vh, 22px) 10px;
  min-height: 44px; /* comfortable tap target on all touch devices */
  cursor: pointer;
  transition: transform .15s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
  touch-action: manipulation;
}

.option-btn:hover:not(:disabled) {
  transform: translateY(-3px);
  border-color: var(--comet-teal);
  box-shadow: 0 0 20px rgba(79, 227, 193, 0.25);
}

.option-btn:focus-visible {
  outline: 3px solid var(--comet-teal);
  outline-offset: 3px;
}

.option-btn:disabled { cursor: default; }

.option-btn.correct {
  background: linear-gradient(160deg, rgba(79, 227, 193, 0.35), rgba(79, 227, 193, 0.12));
  border-color: var(--success);
  box-shadow: 0 0 26px var(--success-glow);
  animation: pop .35s ease;
}

.option-btn.incorrect {
  background: linear-gradient(160deg, rgba(255, 111, 145, 0.35), rgba(255, 111, 145, 0.12));
  border-color: var(--error);
  box-shadow: 0 0 26px var(--error-glow);
  animation: shake .4s ease;
}

.option-btn.dimmed { opacity: 0.45; }

@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.feedback {
  min-height: 34px;
  text-align: center;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 20px;
  margin: 10px 0 4px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .25s ease, transform .25s ease;
}

.feedback.show { opacity: 1; transform: translateY(0); }
.feedback.correct-text { color: var(--success); }
.feedback.incorrect-text { color: var(--error); }

.next-wrap {
  display: flex;
  justify-content: center;
  margin-top: 14px;
  min-height: 60px;
}

/* ---------- Results screen ---------- */
.results-screen { text-align: center; }

.results-emoji {
  font-size: 60px;
  margin-bottom: 6px;
  animation: floatY 4s ease-in-out infinite;
}

.results-score {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(30px, 7vw, 40px);
  margin: 6px 0 4px;
  color: #ffffff;
}

.results-msg {
  color: var(--ink-soft);
  font-weight: 700;
  margin-bottom: 22px;
}

.results-stars {

/* ---------- 6. Responsive ---------- */

/* Phones (portrait) — iPhone SE through Pro Max, small Android phones */
@media (max-width: 480px) {
  .options-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .audio-btn { padding: 14px 24px; font-size: 17px; }

@media (min-width: 600px) and (max-width: 1024px) {

   windows, or fullscreen on a small display. Trims vertical space so
   everything fits without the card overflowing the screen. */

  <!-- ============================================================
       GAME LOGIC — you shouldn't need to edit this to change quiz
       content (that's all in the QUESTION_BANK above). Settings you
       CAN tweak are called out near the top (QUESTIONS_PER_GAME,
       STAR_COUNT, WARP_* / QUESTION_WARP_* galaxy-transition timings,

  <script>
/* ============================================================
   ALPHABET LISTENING QUIZ — GAME LOGIC
   ============================================================
   You generally should NOT need to edit this section to update
   quiz content — that all lives in the QUESTION_BANK <script>
   above.

   Settings you CAN safely change below:
   - QUESTIONS_PER_GAME : how many questions are played each round
   - STAR_COUNT         : how many background stars are drawn
   - WARP_*             : timing/density of the big galaxy-entrance
                          hyperspace sequence (Start Mission)
   - QUESTION_WARP_*    : timing/density of the shorter galaxy zoom
                          that plays between every question
   - SHOOTING_STAR_*    : how often shooting stars streak by
   - FLOATING_ROCKET_*  : how often 🚀 emoji drift across the screen,
                          and how many can be on screen at once
   - calcTimeBonus()    : the time-bonus point table for scoring
   - BEST_SCORE_KEY     : the localStorage key the best score is saved under
   ============================================================ */

const QUESTIONS_PER_GAME = 7; // <-- change this to play more/fewer questions per game
const STAR_COUNT = 90;        // <-- change this to make the sky sparser/denser

/* Ambient shooting stars & floating rockets — these play continuously
   throughout the WHOLE site (start screen, quiz, results), independent
   of the hyperspace transitions below. Each spawns on a random delay
   somewhere between its MIN and MAX, forever. */
const SHOOTING_STAR_MIN_DELAY_MS = 2200;
const SHOOTING_STAR_MAX_DELAY_MS = 5200;
const FLOATING_ROCKET_MIN_DELAY_MS = 4500;
const FLOATING_ROCKET_MAX_DELAY_MS = 9500;
const FLOATING_ROCKET_MAX_CONCURRENT = 2; // never more than this many on screen at once

/* Galaxy entrance transition timing (all in milliseconds).
   Feel free to tune these — see beginGalaxyEntrance() below for how
   they fit together. */
const WARP_STAR_COUNT = 220;   // how many streaking stars during hyperspace
const WARP_ACCEL_MS   = 1600;  // time to accelerate to full hyperspace speed
const WARP_HOLD_MS    = 250;   // brief hold at top speed before the flash
const WARP_EXIT_MS    = 650;   // fade from warp back into the quiz

/* Question-to-question galaxy zoom transition (a shorter, lighter
   version of the same hyperspace effect, replayed every time the
   student moves to a new question). NOTE: QUESTION_EXIT_MS and
   QUESTION_ENTER_MS must match the transition durations set on
   .question-content / .question-content.q-exit in style.css — keep
   all three in sync if you change any of them. */
const QUESTION_WARP_STAR_COUNT = 70;   // fewer stars than the big entrance
const QUESTION_WARP_ACCEL_MS   = 450;  // quick ramp — this is a short hop, not a full jump
const QUESTION_EXIT_MS  = 320;  // outgoing question rushing/blurring past (matches CSS q-exit)
const QUESTION_ENTER_MS = 360;  // incoming question easing in from the distance (matches base CSS)

/* Scoring & best-score persistence.
   Total score for a round = (correct answers × 100) + a time bonus
   looked up from calcTimeBonus() below. The best score ever achieved
   is saved in the browser's localStorage (works offline, survives
   closing the tab/browser, and has no built-in expiry — so it easily
   satisfies "saved on the device for at least a day"; it stays until
   the student clears their browser data). */
const POINTS_PER_CORRECT_ANSWER = 100;
const BEST_SCORE_KEY = 'galaxyAlphabetQuiz.bestScore.v1';

// Time-bonus table (seconds taken to answer all 7 questions → bonus
// points). Ranges are inclusive of their lower bound. Edit the
// numbers here to change the scoring — order doesn't matter to the
// function, just keep the ranges the way you want them read.
function calcTimeBonus(seconds) {
  if (seconds < 40) return 300;   // under 40s
  if (seconds < 50) return 150;   // 40–49s
  if (seconds < 60) return 80;    // 50–59s
  if (seconds < 70) return 100;   // 60–69s
  if (seconds < 80) return 75;    // 70–79s
  if (seconds < 90) return 55;    // 80–89s
  if (seconds < 100) return 35;   // 90–99s
  if (seconds < 110) return 30;   // 100–109s
  if (seconds < 120) return 20;   // 110–119s
  return 10;                      // 120s or more
}

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------
   STATE
   ------------------------------------------------------------ */
const state = {
  roundQuestions: [], // the QUESTIONS_PER_GAME questions chosen for this round
  currentIndex: 0,
  score: 0,
  answeredCurrent: false,
  results: [], // true/false per question, in order, for the constellation trail
  transitioning: false, // true while the galaxy entrance animation is playing
  startTime: null,      // performance.now() at the moment the round started
  elapsedSeconds: null  // captured once the 7th question is answered
};

/* ------------------------------------------------------------

   ------------------------------------------------------------ */
const screens = {
  start: document.getElementById('startScreen'),
  game: document.getElementById('gameScreen'),
  results: document.getElementById('resultsScreen')

/* ------------------------------------------------------------
   BACKGROUND STAR FIELD
   Purely decorative — generates STAR_COUNT twinkling dots.
   ------------------------------------------------------------ */
function buildStarField() {
  starField.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < STAR_COUNT; i++) {
    const star = document.createElement('div');
    const size = Math.random() < 0.15 ? (Math.random() * 2 + 2.5) : (Math.random() * 1.5 + 1);
    const isBig = size > 3;
    star.className = 'star' + (isBig ? ' big' : '');
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    const duration = (Math.random() * 3 + 2.5).toFixed(2);
    const delay = (Math.random() * 4).toFixed(2);
    star.style.setProperty('--min-o', (Math.random() * 0.25 + 0.1).toFixed(2));
    star.style.setProperty('--max-o', (Math.random() * 0.4 + 0.6).toFixed(2));
    star.style.animationDuration = duration + 's';
    star.style.animationDelay = delay + 's';
    frag.appendChild(star);
  }
  starField.appendChild(frag);
}

/* ------------------------------------------------------------
   AMBIENT FLOATING ROCKETS & SHOOTING STARS
   ------------------------------------------------------------
   Purely decorative flourishes that run continuously for the whole
   site visit — start screen, quiz, and results alike — completely
   independent of the hyperspace warp system below. Each function
   spawns one element, lets its CSS animation play out, then removes
   it; scheduleShootingStars()/scheduleFloatingRockets() just keep
   calling that on a random delay, forever.
   ------------------------------------------------------------ */
function randRange(min, max) {
  return Math.random() * (max - min) + min;
}

// A quick streak with a fading trail that shoots across the screen
// at a random spot/angle and disappears.
function spawnShootingStar() {
  if (!ambientLayer) return;
  const el = document.createElement('div');
  el.className = 'shooting-star';

  const startTop = randRange(-5, 55);   // upper half-ish of the screen, in %
  const startLeft = randRange(0, 100);  // %
  // Mostly a classic downward-right sweep, occasionally mirrored for variety.
  const angle = randRange(15, 35) * (Math.random() < 0.75 ? 1 : -1);
  const distance = randRange(260, 520); // px travelled
  const duration = randRange(900, 1500);
  const length = randRange(90, 160);    // px, the visible trail length

  el.style.top = startTop + '%';
  el.style.left = startLeft + '%';
  el.style.width = length + 'px';
  el.style.setProperty('--angle', angle.toFixed(1) + 'deg');
  el.style.setProperty('--distance', distance.toFixed(0) + 'px');
  el.style.animationDuration = duration.toFixed(0) + 'ms';

  el.addEventListener('animationend', () => el.remove());
  ambientLayer.appendChild(el);
}

function scheduleShootingStars() {
  const delay = randRange(SHOOTING_STAR_MIN_DELAY_MS, SHOOTING_STAR_MAX_DELAY_MS);
  setTimeout(() => {
    spawnShootingStar();
    // Every so often, send a second one shortly after so a few are
    // visible together, matching "several shooting stars".
    if (Math.random() < 0.3) {
      setTimeout(spawnShootingStar, randRange(150, 500));
    }
    scheduleShootingStars();
  }, delay);
}

// A slow-drifting 🚀 emoji that cruises across part of the screen and
// fades out. Its rotation is computed FROM its actual travel vector
// (dx, dy), so the nose always points the way it's actually moving —
// and only FLOATING_ROCKET_MAX_CONCURRENT can exist on screen at once.
let activeRocketCount = 0;

function spawnFloatingRocket() {
  if (!ambientLayer) return;
  if (activeRocketCount >= FLOATING_ROCKET_MAX_CONCURRENT) return; // try again next scheduled tick

  const el = document.createElement('div');
  el.className = 'floating-rocket';
  el.textContent = '🚀';

  // Pick a travel direction first, then choose a spawn point on the
  // opposite side so the rocket actually crosses the visible screen.
  const goingRight = Math.random() < 0.5;
  const goingDown = Math.random() < 0.5;
  const dx = (goingRight ? 1 : -1) * randRange(200, 420);
  const dy = (goingDown ? 1 : -1) * randRange(80, 260);

  const startLeft = goingRight ? randRange(-5, 35) : randRange(65, 100);
  const startTop = goingDown ? randRange(5, 35) : randRange(55, 90);

  // Rotate so the emoji's nose (which points up-and-to-the-right by
  // default, ~45° off the horizontal) aligns with the direction it's
  // actually travelling.
  const travelAngleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
  const angle = travelAngleDeg - 45;

  const duration = randRange(9000, 15000);
  const size = randRange(20, 34);

  el.style.top = startTop + '%';
  el.style.left = startLeft + '%';
  el.style.fontSize = size.toFixed(1) + 'px';
  el.style.setProperty('--dx', dx.toFixed(0) + 'px');
  el.style.setProperty('--dy', dy.toFixed(0) + 'px');
  el.style.setProperty('--angle', angle.toFixed(1) + 'deg');
  el.style.animationDuration = duration.toFixed(0) + 'ms';

  activeRocketCount++;
  el.addEventListener('animationend', () => {
    el.remove();
    activeRocketCount--;
  });
  ambientLayer.appendChild(el);
}

function scheduleFloatingRockets() {
  const delay = randRange(FLOATING_ROCKET_MIN_DELAY_MS, FLOATING_ROCKET_MAX_DELAY_MS);
  setTimeout(() => {
    spawnFloatingRocket();
    scheduleFloatingRockets();
  }, delay);
}

/* ------------------------------------------------------------
   GALAXY ENTRANCE TRANSITION (hyperspace warp)
   ------------------------------------------------------------
   Draws a "flying through the galaxy" star-streak animation on a
   full-screen canvas when the student clicks "Start Mission".
   Stars spawn near the center and accelerate outward toward the
   edges of the screen, growing larger/brighter as they approach —
   classic warp-speed depth effect — before a soft light flash
   marks "arriving" in the galaxy and the quiz fades in underneath.

   This section is self-contained: if you never touch it, the rest
   of the game logic below works exactly as before.
   ------------------------------------------------------------ */
let warpCtx = null;
let warpStars = [];
let warpMaxRadius = 0;
let warpRAF = null;
let warpAnimStart = 0;
let warpAccelMsActive = WARP_ACCEL_MS; // set before each run: big entrance vs quick question hop

function setupWarpCanvas() {
  if (!warpCanvas.getContext) return; // very old browsers: skip gracefully
  warpCtx = warpCanvas.getContext('2d');
  resizeWarpCanvas();
  window.addEventListener('resize', resizeWarpCanvas);
}

function resizeWarpCanvas() {
  if (!warpCtx) return;
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  warpCanvas.width = w * dpr;
  warpCanvas.height = h * dpr;
  warpCanvas.style.width = w + 'px';
  warpCanvas.style.height = h + 'px';
  warpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Creates one warp star. `nearCenter` seeds it close to the middle
// (used when a star finishes its flight and respawns).
function makeWarpStar(nearCenter) {
  const roll = Math.random();
  return {
    angle: Math.random() * Math.PI * 2,
    r: nearCenter ? Math.random() * 24 : Math.random() * warpMaxRadius * 0.5,
    spd: 0.6 + Math.random() * 1.4, // per-star speed variation, for depth
    // mostly white starlight, with a sprinkle of gold/teal for magic
    hue: roll < 0.14 ? 'gold' : (roll < 0.26 ? 'teal' : 'white')
  };
}

function initWarpStars(count) {
  warpMaxRadius = Math.hypot(window.innerWidth, window.innerHeight) / 2 * 1.05;
  warpStars = [];
  const total = count || WARP_STAR_COUNT;
  for (let i = 0; i < total; i++) {
    warpStars.push(makeWarpStar(false));
  }
}

function warpFrame(now) {
  const elapsed = now - warpAnimStart;
  // Ease-in acceleration: slow drift at first, rapidly ramping up to
  // full hyperspace speed by warpAccelMsActive, then holding there.
  const accelProgress = Math.min(elapsed / warpAccelMsActive, 1);
  const eased = accelProgress * accelProgress;
  const speedFactor = 0.35 + eased * 5.5;

  const w = window.innerWidth;
  const h = window.innerHeight;
  const cx = w / 2;
  const cy = h / 2;

  // Translucent fill (instead of a full clear) so fast stars leave a
  // soft streak behind them — the classic warp-speed trail look.
  warpCtx.fillStyle = 'rgba(6, 8, 24, 0.28)';
  warpCtx.fillRect(0, 0, w, h);

  for (let i = 0; i < warpStars.length; i++) {
    const star = warpStars[i];
    // Stars further from center travel faster, simulating perspective
    // as they approach the "camera".
    const delta = speedFactor * star.spd * (2 + star.r * 0.045);
    star.r += delta;

    if (star.r > warpMaxRadius) {
      warpStars[i] = makeWarpStar(true);
      continue;
    }

    const ratio = star.r / warpMaxRadius;
    const x = cx + Math.cos(star.angle) * star.r;
    const y = cy + Math.sin(star.angle) * star.r;
    const size = 0.6 + ratio * 3.6;
    const alpha = Math.min(1, 0.2 + ratio * 1.1);

    let color;
    if (star.hue === 'gold') color = `rgba(255, 217, 102, ${alpha})`;
    else if (star.hue === 'teal') color = `rgba(79, 227, 193, ${alpha})`;
    else color = `rgba(255, 255, 255, ${alpha})`;

    warpCtx.beginPath();
    warpCtx.fillStyle = color;
    warpCtx.arc(x, y, size, 0, Math.PI * 2);
    warpCtx.fill();
  }

  warpRAF = requestAnimationFrame(warpFrame);
}

function stopWarpAnimation() {
  if (warpRAF) cancelAnimationFrame(warpRAF);
  warpRAF = null;
  if (warpCtx) warpCtx.clearRect(0, 0, warpCanvas.width, warpCanvas.height);
}

// Called when the student clicks "Start Mission". Plays the
// cinematic hyperspace sequence, then hands off to startGame().
function beginGalaxyEntrance() {
  if (state.transitioning) return; // ignore extra clicks mid-transition
  state.transitioning = true;
  startBtn.disabled = true;
  startRoundTimer(); // timing starts the instant Start Mission is clicked

  // Respect motion-sensitivity settings: skip straight to the quiz
  // with a short, gentle fade instead of the full hyperspace sequence.
  if (prefersReducedMotion || !warpCtx) {
    appShell.classList.add('transition-hide');
    setTimeout(() => {
      startGame();
      appShell.classList.remove('transition-hide');
      state.transitioning = false;
      startBtn.disabled = false;
    }, 300);
    return;
  }

  // 1) Start screen fades/shrinks away, hyperspace canvas fades in,
  //    stars begin accelerating outward from the center.
  appShell.classList.add('transition-hide');
  document.body.classList.add('warping');
  warpAccelMsActive = WARP_ACCEL_MS;
  initWarpStars(WARP_STAR_COUNT);
  warpAnimStart = performance.now();
  warpCanvas.classList.add('active');
  stopWarpAnimation();
  warpRAF = requestAnimationFrame(warpFrame);

  // 2) Near the end of the acceleration, trigger the bright
  //    "arriving in the galaxy" flash.
  setTimeout(() => {
    galaxyFlash.classList.remove('flash');
    void galaxyFlash.offsetWidth; // restart animation if replayed
    galaxyFlash.classList.add('flash');
  }, WARP_ACCEL_MS);

  // 3) While the app shell is still hidden, swap in the quiz screen
  //    and pick the round's questions — invisible to the student, so
  //    there's no jarring jump when everything fades back in.
  setTimeout(() => {
    startGame();
  }, WARP_ACCEL_MS + WARP_HOLD_MS);

  // 4) Fade the quiz back in and the hyperspace canvas/nebula bloom
  //    back out, completing the "arrival".
  setTimeout(() => {
    appShell.classList.remove('transition-hide');
    warpCanvas.classList.remove('active');
    document.body.classList.remove('warping');
  }, WARP_ACCEL_MS + WARP_HOLD_MS + 120);

  // 5) Clean up once everything has faded, so the canvas isn't
  //    silently animating in the background forever.
  setTimeout(() => {
    stopWarpAnimation();
    state.transitioning = false;
    startBtn.disabled = false;
  }, WARP_ACCEL_MS + WARP_HOLD_MS + 120 + WARP_EXIT_MS);
}

/* ------------------------------------------------------------
   QUESTION-TO-QUESTION GALAXY TRANSITION
   ------------------------------------------------------------
   Every time the student moves to a new question (or on to the
   results screen), the current question rushes bigger/brighter and
   blurs past — like it's flying past at warp speed — a burst of
   hyperspace stars streaks past behind it, and the next question
   starts tiny and far away, then zooms up to size as it arrives —
   the same galaxy effect as the opening entrance, just a short hop
   instead of a full journey, with the content moving the same way
   the stars do instead of just fading in place.
   ------------------------------------------------------------ */

// Plays a short hyperspace star burst behind a question transition.
// `visibleMs` is how long the canvas stays visible before fading —
// keep it roughly in line with QUESTION_EXIT_MS + QUESTION_ENTER_MS.
function playQuestionWarpBurst(visibleMs) {
  if (!warpCtx) return;
  document.body.classList.add('warping');
  warpAccelMsActive = QUESTION_WARP_ACCEL_MS;
  initWarpStars(QUESTION_WARP_STAR_COUNT);
  warpAnimStart = performance.now();
  stopWarpAnimation();
  warpCanvas.classList.add('active');
  warpRAF = requestAnimationFrame(warpFrame);

  setTimeout(() => {
    warpCanvas.classList.remove('active');
    document.body.classList.remove('warping');
  }, visibleMs);

  // Give the canvas's own fade-out transition (defined in style.css)
  // time to finish before we stop drawing and clear it.
  setTimeout(() => {
    stopWarpAnimation();
  }, visibleMs + 650);
}

// Swaps the on-screen content using `onSwap`, wrapped in the
// zoom-out / hyperspace-burst / zoom-in sequence described above.
// `exitEl` is the content currently on screen; `enterEl` is what
// should be visible afterward (they're the same element for a
// same-screen question change, and different elements when the
// swap also crosses from the game screen to the results screen,
// back again via "Play Again", or home via the black hole button).
// `exitClass` picks which exit animation plays — 'q-exit' (default,
// flying-past-camera) or 'q-suck' (pulled into the black hole).
function playGalaxyZoomTransition(exitEl, enterEl, onSwap, exitClass) {
  exitClass = exitClass || 'q-exit';

  if (prefersReducedMotion) {
    onSwap();
    return;
  }

  playQuestionWarpBurst(QUESTION_EXIT_MS + QUESTION_ENTER_MS - 60);

  // 1) Current content plays its exit animation (rushing past the
  //    camera, or being pulled into the black hole).
  exitEl.classList.remove('q-enter', 'q-exit', 'q-suck');
  exitEl.classList.add(exitClass);

  // 2) Once it's fully faded, perform the actual screen/content swap
  //    while everything is invisible, then flip the new content
  //    straight to the "far away" state so it can zoom in from there.
  setTimeout(() => {
    onSwap();
    if (exitEl !== enterEl) exitEl.classList.remove(exitClass);
    enterEl.classList.remove('q-exit', 'q-suck', 'q-enter');
    enterEl.classList.add('q-enter');
    void enterEl.offsetWidth; // force reflow so the next class change transitions
    requestAnimationFrame(() => {
      // 3) Zoom the new content in from the distance to full size.
      enterEl.classList.remove('q-enter');
    });
  }, QUESTION_EXIT_MS);
}

/* ------------------------------------------------------------
   MISSION TIMER
   ------------------------------------------------------------
   Tracks how long the student takes to answer all of a round's
   questions — from the moment they start the round (via "Start
   Mission" or "Play Again") to the instant they answer the final
   question. Feeds into the scoring in calcTimeBonus() above.
   ------------------------------------------------------------ */
let gameTimerIntervalId = null;

function formatTime(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}

// Call this at the moment a round begins (click of Start Mission or
// Play Again) — starts the clock and the ticking display.
function startRoundTimer() {
  state.startTime = performance.now();
  state.elapsedSeconds = null;
  stopGameTimer();
  updateTimerDisplay();
  gameTimerIntervalId = setInterval(updateTimerDisplay, 250);
}

function stopGameTimer() {
  if (gameTimerIntervalId) {
    clearInterval(gameTimerIntervalId);
    gameTimerIntervalId = null;
  }
}

function updateTimerDisplay() {
  if (!timerPill || state.startTime == null) return;
  const liveSeconds = state.elapsedSeconds != null
    ? state.elapsedSeconds
    : (performance.now() - state.startTime) / 1000;
  timerPill.textContent = '⏱ ' + formatTime(liveSeconds);
}

/* ------------------------------------------------------------
   BEST SCORE (persisted on this device via localStorage)
   ------------------------------------------------------------
   localStorage has no built-in expiry — a saved value stays until
   the student (or their browser) clears site data, which is far
   more than the "at least a day" this needs to survive. Wrapped in
   try/catch because some browsers block storage entirely in private
   browsing — in that case the game still works, it just won't
   remember a best score between visits.
   ------------------------------------------------------------ */
function loadBestScore() {
  try {
    const raw = localStorage.getItem(BEST_SCORE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (typeof parsed.points !== 'number' || !isFinite(parsed.points)) return null;
    return parsed;
  } catch (e) {
    return null;
  }
}

function saveBestScore(points) {
  try {
    localStorage.setItem(BEST_SCORE_KEY, JSON.stringify({
      points: points,
      savedAt: Date.now()
    }));
  } catch (e) {
    // Storage unavailable (private browsing, disabled, quota, etc.) —
    // fail silently; the round's score still displays normally.
  }
}

/* ------------------------------------------------------------
   QUESTION SELECTION
   Picks QUESTIONS_PER_GAME unique random questions from the
   50-question bank using a Fisher–Yates shuffle, so both the
   selection AND the order are freshly randomized every game.
   ------------------------------------------------------------ */
function shuffle(array) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickRoundQuestions() {
  const shuffledBank = shuffle(QUESTION_BANK);
  return shuffledBank.slice(0, QUESTIONS_PER_GAME);
}

/* ------------------------------------------------------------
   SCREEN NAVIGATION
   ------------------------------------------------------------ */
function showScreen(name) {
  Object.values(screens).forEach(s => s.classList.remove('active'));
  screens[name].classList.add('active');
}

/* ------------------------------------------------------------
   CONSTELLATION PROGRESS TRAIL
   Draws a dashed path with one star-node per question; nodes
   light up gold (correct) or pink (incorrect) as answered, and
   a little rocket travels along the path.
   ------------------------------------------------------------ */
function renderConstellation() {
  const total = state.roundQuestions.length;
  const width = 600;
  const height = 54;
  const padding = 30;
  const step = total > 1 ? (width - padding * 2) / (total - 1) : 0;
  const y = height / 2;

  let pathD = `M ${padding} ${y}`;
  let nodesSvg = '';

  for (let i = 0; i < total; i++) {
    const x = padding + step * i;
    if (i > 0) pathD += ` L ${x} ${y}`;

    let cls = 'constellation-node';
    if (i < state.results.length) {
      cls += state.results[i] ? ' done' : ' wrong-node';
    } else if (i === state.currentIndex) {
      cls += ' current';
    }
    const r = i === state.currentIndex && i >= state.results.length ? 8 : 6;
    nodesSvg += `<circle class="${cls}" cx="${x}" cy="${y}" r="${r}"></circle>`;
  }

  constellationEl.innerHTML = `
    <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
      <path class="constellation-line" d="${pathD}"></path>
      ${nodesSvg}
    </svg>
    <div class="rocket" id="rocketIcon" aria-hidden="true">🚀</div>
  `;

  // position rocket over current node using percentage of width
  const rocket = document.getElementById('rocketIcon');
  const progressIndex = Math.min(state.currentIndex, total - 1);
  const xPercent = total > 1
    ? ((padding + step * progressIndex) / width) * 100
    : 50;
  rocket.style.left = xPercent + '%';
}

/* ------------------------------------------------------------
   GAME FLOW
   ------------------------------------------------------------ */
function startGame() {
  state.roundQuestions = pickRoundQuestions();
  state.currentIndex = 0;
  state.score = 0;
  state.results = [];
  showScreen('game');
  renderQuestion();
}

function renderQuestion() {
  state.answeredCurrent = false;
  const total = state.roundQuestions.length;
  const q = state.roundQuestions[state.currentIndex];

  questionCounter.textContent = `Question ${state.currentIndex + 1} / ${total}`;
  scoreCounter.textContent = `Score: ${state.score} / ${state.currentIndex}`;

  renderConstellation();

  // reset audio + feedback + next button
  letterAudio.pause();
  letterAudio.currentTime = 0;
  letterAudio.src = q.audio;
  playAudioBtn.classList.remove('playing');
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';
  nextBtn.style.display = 'none';

  // build answer option buttons (shuffled so the correct answer
  // isn't always in the same position)
  optionsGrid.innerHTML = '';
  const shuffledOptions = shuffle(q.options);
  shuffledOptions.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.type = 'button';
    btn.textContent = letter;
    btn.setAttribute('aria-label', `Answer ${letter}`);
    btn.addEventListener('click', () => handleAnswer(letter, btn, q.correctAnswer));
    optionsGrid.appendChild(btn);
  });

  // autoplay the sound for this question (best effort; browsers may
  // block autoplay, in which case the student just taps Play Sound)
  playCurrentAudio();
}

function playCurrentAudio() {
  playAudioBtn.classList.add('playing');
  const playPromise = letterAudio.play();
  if (playPromise && playPromise.catch) {
    playPromise.catch(() => {
      // Autoplay blocked, or the mp3 file hasn't been added yet.
      // Silently ignore — the student can press "Play Sound" manually.
      playAudioBtn.classList.remove('playing');
    });
  }
  letterAudio.onended = () => playAudioBtn.classList.remove('playing');
}

playAudioBtn.addEventListener('click', () => {
  letterAudio.currentTime = 0;
  playCurrentAudio();
});

function handleAnswer(selectedLetter, btnEl, correctLetter) {
  // Prevent multiple submissions for the same question
  if (state.answeredCurrent) return;
  state.answeredCurrent = true;

  const isCorrect = selectedLetter === correctLetter;
  state.results[state.currentIndex] = isCorrect;

  const allOptionButtons = optionsGrid.querySelectorAll('.option-btn');
  allOptionButtons.forEach(b => {
    b.disabled = true;
    if (b.textContent === correctLetter) {
      b.classList.add('correct');
    } else if (b === btnEl) {
      b.classList.add('incorrect');
    } else {
      b.classList.add('dimmed');
    }
  });

  if (isCorrect) {
    state.score++;
    feedbackEl.textContent = '✓ Correct!';
    feedbackEl.classList.add('correct-text');
  } else {
    feedbackEl.textContent = `✗ Try again! It was "${correctLetter}".`;
    feedbackEl.classList.add('incorrect-text');
  }
  feedbackEl.classList.add('show');

  scoreCounter.textContent = `Score: ${state.score} / ${state.currentIndex + 1}`;
  renderConstellation();

  const total = state.roundQuestions.length;
  const isLastQuestion = state.currentIndex + 1 >= total;
  if (isLastQuestion && state.elapsedSeconds == null) {
    // "Complete" the mission clock the instant the last question is
    // answered — not whenever they happen to click through to results.
    state.elapsedSeconds = (performance.now() - state.startTime) / 1000;
    stopGameTimer();
    updateTimerDisplay(); // show the final frozen time, not a live-ticking one
  }

  nextBtn.textContent = isLastQuestion ? 'See Results →' : 'Next →';
  nextBtn.style.display = 'inline-block';
}

nextBtn.addEventListener('click', () => {
  if (state.transitioning) return; // ignore extra clicks mid-transition
  state.transitioning = true;
  nextBtn.disabled = true;

  const total = state.roundQuestions.length;
  const isLastQuestion = state.currentIndex + 1 >= total;

  playGalaxyZoomTransition(
    questionContent,
    isLastQuestion ? resultsContent : questionContent,
    () => {
      if (isLastQuestion) {
        showResults();
      } else {
        state.currentIndex++;
        renderQuestion();
      }
    }
  );

  setTimeout(() => {
    state.transitioning = false;
    nextBtn.disabled = false;
  }, QUESTION_EXIT_MS + QUESTION_ENTER_MS + 60);
});

/* ------------------------------------------------------------
   RESULTS SCREEN
   ------------------------------------------------------------ */
function showResults() {
  const total = state.roundQuestions.length;

  // Total mission score: correct answers × 100, plus a time bonus
  // looked up from calcTimeBonus() — see that function to adjust the
  // point table. No breakdown is shown, just the final sum.
  const correctPoints = state.score * POINTS_PER_CORRECT_ANSWER;
  const timeTakenSeconds = state.elapsedSeconds != null ? state.elapsedSeconds : 0;
  const timeBonus = calcTimeBonus(timeTakenSeconds);
  const totalPoints = correctPoints + timeBonus;

  resultsScore.textContent = `${totalPoints} POINTS`;

  let message;
  const ratio = state.score / total;
  if (ratio === 1) {
    message = 'Perfect mission — you heard every letter!';
  } else if (ratio >= 0.7) {
    message = 'Awesome listening, space explorer!';
  } else if (ratio >= 0.4) {
    message = 'Nice work! Keep practicing those sounds.';
  } else {
    message = 'Good try! Let\u2019s blast off again and listen closely.';
  }
  resultsMsg.textContent = message;

  const filled = Math.round(ratio * 5);
  resultsStars.textContent = '⭐'.repeat(filled) + '☆'.repeat(5 - filled);

  // Best score, saved on this device (see BEST SCORE section above).
  const previousBest = loadBestScore();
  const isNewBest = !previousBest || totalPoints > previousBest.points;
  if (isNewBest) {
    saveBestScore(totalPoints);
  }
  const bestPoints = isNewBest ? totalPoints : previousBest.points;
  resultsBest.textContent = (isNewBest ? '🏆 New Best! ' : '🏆 Best: ') + bestPoints + ' POINTS';
  resultsBest.classList.toggle('new-best', isNewBest);

  showScreen('results');
}

/* ------------------------------------------------------------
   EVENT WIRING
   ------------------------------------------------------------ */
// First launch: the full cinematic galaxy-entrance sequence.
startBtn.addEventListener('click', beginGalaxyEntrance);
// Replaying: uses the same short galaxy zoom/hyperspace-burst as
// between questions, rather than replaying the full ~2.5s entrance,
// so repeat play stays snappy.
playAgainBtn.addEventListener('click', () => {
  if (state.transitioning) return;
  state.transitioning = true;
  playAgainBtn.disabled = true;
  startRoundTimer(); // timing restarts the instant Play Again is clicked

  playGalaxyZoomTransition(resultsContent, questionContent, startGame);

  setTimeout(() => {
    state.transitioning = false;
    playAgainBtn.disabled = false;
  }, QUESTION_EXIT_MS + QUESTION_ENTER_MS + 60);
});

// Black hole button: abandons the current round and returns to the
// very first screen, with a "pulled into the black hole" exit instead
// of the usual forward-motion zoom.
blackholeBtn.addEventListener('click', () => {
  if (state.transitioning) return;
  state.transitioning = true;
  blackholeBtn.disabled = true;

  stopGameTimer();
  letterAudio.pause();

  playGalaxyZoomTransition(questionContent, startContent, () => {
    showScreen('start');
  }, 'q-suck');

  setTimeout(() => {
    state.transitioning = false;
    blackholeBtn.disabled = false;
  }, QUESTION_EXIT_MS + QUESTION_ENTER_MS + 60);
});

/* ------------------------------------------------------------
   INIT
   ------------------------------------------------------------ */
buildStarField();
setupWarpCanvas();
