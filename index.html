<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  />

  <title>Galaxy Alphabet Quiz</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap"
    rel="stylesheet"
  />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ============================================================
       BACKGROUND
       ============================================================ -->

  <div class="sky"></div>
  <div class="nebula"></div>

  <!-- Twinkling stars generated by app.js -->
  <div
    class="stars"
    id="starField"
    aria-hidden="true"
  ></div>

  <!-- Ambient rockets + shooting stars generated by app.js -->
  <div
    class="ambient-layer"
    id="ambientLayer"
    aria-hidden="true"
  ></div>

  <!-- Hyperspace transition canvas -->
  <canvas
    id="warpCanvas"
    class="warp-canvas"
    aria-hidden="true"
  ></canvas>

  <!-- Galaxy arrival flash -->
  <div
    id="galaxyFlash"
    class="galaxy-flash"
    aria-hidden="true"
  ></div>


  <!-- ============================================================
       MAIN APP
       ============================================================ -->

  <main
    class="app"
    id="appShell"
  >

    <div class="card">


      <!-- ==========================================================
           START SCREEN
           ========================================================== -->

      <section
        id="startScreen"
        class="screen active start-screen"
      >

        <div class="brand">

          <div
            class="brand-emoji"
            aria-hidden="true"
          >
            🚀
          </div>

          <h1 class="title">
            Galaxy Alphabet Quiz
          </h1>

        </div>


        <p class="subtitle">
          Blast off, listen carefully, and catch<br>
          the letter sounds among the stars!
        </p>


        <div
          class="start-illustration"
          aria-hidden="true"
        >
          <span>⭐</span>
          <span>🪐</span>
          <span>✨</span>
        </div>


        <button
          id="startBtn"
          class="btn btn-primary btn-lg btn-block"
          type="button"
        >
          🚀 Start Mission
        </button>

      </section>



      <!-- ==========================================================
           GAME SCREEN
           ========================================================== -->

      <section
        id="gameScreen"
        class="screen"
        aria-live="polite"
      >


        <!-- ========================================================
             GAME HEADER

             HOME BUTTON
             QUESTION NUMBER
             TIMER
             SCORE
             ======================================================== -->

        <div class="game-header">


          <!-- Left side:
               black hole + question number -->

          <div class="game-header-left">

            <!--
              BLACK HOLE HOME BUTTON

              This is intentionally an actual button rather than
              a decorative element.

              app.js will attach the return-to-home functionality.
            -->

            <button
              id="homeBtn"
              class="blackhole-home"
              type="button"
              aria-label="Return to home"
              title="Return to Home"
            >
              <span
                class="blackhole-icon"
                aria-hidden="true"
              >
                🕳️
              </span>
            </button>


            <span
              class="pill question-pill"
              id="questionCounter"
            >
              Question 1 / 7
            </span>

          </div>


          <!-- Right side:
               timer + score -->

          <div class="game-header-right">

            <span
              class="pill timer-pill"
              id="timerCounter"
              aria-label="Mission time"
            >
              ⏱ 00:00
            </span>


            <span
              class="pill score-pill"
              id="scoreCounter"
            >
              Score: 0
            </span>

          </div>

        </div>



        <!-- ========================================================
             CONSTELLATION PROGRESS TRAIL
             ======================================================== -->

        <div
          class="constellation"
          id="constellation"
          aria-hidden="true"
        ></div>



        <!-- ========================================================
             CURRENT QUESTION CONTENT
             ======================================================== -->

        <div
          class="question-content"
          id="questionContent"
        >

          <p class="prompt">
            Which letter did you hear?
          </p>


          <!-- AUDIO BUTTON -->

          <button
            id="playAudioBtn"
            class="audio-btn"
            type="button"
            aria-label="Play the letter sound"
          >

            <span
              class="speaker-icon"
              aria-hidden="true"
            >
              🔊
            </span>

            <span>
              Play Sound
            </span>

          </button>


          <!-- Hidden native audio element -->

          <audio
            id="letterAudio"
            preload="none"
          ></audio>


          <!-- ANSWER OPTIONS -->

          <div
            class="options-grid"
            id="optionsGrid"
            role="group"
            aria-label="Answer choices"
          ></div>


          <!-- FEEDBACK -->

          <p
            class="feedback"
            id="feedback"
            role="status"
          ></p>

        </div>



        <!-- ========================================================
             NEXT BUTTON
             ======================================================== -->

        <div class="next-wrap">

          <button
            id="nextBtn"
            class="btn btn-secondary"
            type="button"
            style="display:none;"
          >
            Next →
          </button>

        </div>

      </section>



      <!-- ==========================================================
           RESULTS SCREEN
           ========================================================== -->

      <section
        id="resultsScreen"
        class="screen results-screen"
      >

        <div
          class="question-content"
          id="resultsContent"
        >


          <!-- Celebration -->

          <div
            class="results-emoji"
            aria-hidden="true"
          >
            🎉
          </div>


          <h2>
            Great Job, Space Explorer!
          </h2>


          <!-- ======================================================
               TOTAL POINTS

               app.js will replace this with something like:

               660 POINTS
               ====================================================== -->

          <p
            class="results-score"
            id="resultsScore"
          >
            0 POINTS
          </p>


          <!-- ======================================================
               ROUND DETAILS

               Example:

               6 / 7 correct · 73 seconds
               ====================================================== -->

          <p
            class="results-details"
            id="resultsDetails"
          >
            0 / 7 correct · 0 seconds
          </p>


          <!-- ======================================================
               TIME BONUS

               Example:

               Time Bonus: +60 points
               ====================================================== -->

          <p
            class="results-bonus"
            id="resultsBonus"
          >
            Time Bonus: +0 points
          </p>


          <!-- ======================================================
               BEST SCORE

               Saved in localStorage by app.js.

               Example:

               🏆 BEST SCORE
               720 POINTS
               ====================================================== -->

          <div
            class="best-score-box"
            id="bestScoreBox"
          >

            <div
              class="best-score-label"
            >
              🏆 BEST SCORE
            </div>

            <div
              class="best-score-value"
              id="bestScoreValue"
            >
              0 POINTS
            </div>

          </div>


          <!-- Encouragement message -->

          <p
            class="results-msg"
            id="resultsMsg"
          ></p>


          <!-- Stars -->

          <div
            class="results-stars"
            id="resultsStars"
            aria-hidden="true"
          ></div>


          <!-- Play again -->

          <button
            id="playAgainBtn"
            class="btn btn-primary btn-lg btn-block"
            type="button"
          >
            🔄 Play Again
          </button>

        </div>

      </section>

    </div>

  </main>
