<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Galaxy Alphabet Quiz</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- decorative background layers (see style.css / app.js for star generation) -->
  <div class="sky"></div>
  <div class="nebula"></div>
  <div class="stars" id="starField" aria-hidden="true"></div>

  <!-- Ambient floating satellites + shooting stars — plays continuously
       throughout the whole site (start screen, quiz, results), not
       just during transitions. Elements are created/removed by
       app.js; this is just their container. -->
  <div class="ambient-layer" id="ambientLayer" aria-hidden="true"></div>

  <!-- Hyperspace canvas: draws the flying-through-the-galaxy transition
       when the student clicks "Start Mission". Invisible/idle otherwise. -->
  <canvas id="warpCanvas" class="warp-canvas" aria-hidden="true"></canvas>

  <!-- Brief bright/glowy flash as the student "arrives" in the galaxy -->
  <div id="galaxyFlash" class="galaxy-flash" aria-hidden="true"></div>

  <main class="app" id="appShell">
    <div class="card">

      <!-- ============================================================
           START SCREEN
           ============================================================ -->
      <section id="startScreen" class="screen active start-screen">
        <div class="question-content" id="startContent">
          <div class="brand">
            <div class="brand-emoji" aria-hidden="true">🚀</div>
            <h1 class="title">Galaxy Alphabet Quiz</h1>
          </div>
          <p class="subtitle">Blast off, listen carefully, and catch<br>the letter sounds among the stars!</p>
          <div class="start-illustration" aria-hidden="true">
            <span>⭐</span><span>🪐</span><span>✨</span>
          </div>
          <button id="startBtn" class="btn btn-primary btn-lg btn-block">🚀 Start Mission</button>
        </div>
      </section>

     <!-- ============================================================
     GAME SCREEN
     ============================================================ -->
<section id="gameScreen" class="screen" aria-live="polite">

  <div class="game-header">

    <div class="header-group">

      <!-- Black hole "return home" button -->
      <div class="blackhole-wrap">
        <button
          id="blackholeBtn"
          class="blackhole-btn"
          type="button"
          aria-label="Leave the mission and return to the home screen"
          title="Return to home screen">
        </button>

        <span class="blackhole-label">ホームに戻る</span>
      </div>

      <!-- Question counter -->
      <span class="pill" id="questionCounter">
        Question 1 / 7
      </span>

    </div>

    <div class="header-group">

      <!-- Mission timer -->
      <span class="pill timer-pill" id="timerPill">
        ⏱ 0:00
      </span>

      <!-- Score -->
      <span class="pill score-pill" id="scoreCounter">
        Score: 0 / 0
      </span>

    </div>

  </div>

        <!-- Constellation progress trail (signature visual element) -->
        <div class="constellation" id="constellation" aria-hidden="true"></div>

        <!-- Everything specific to the CURRENT question lives inside this
             wrapper. app.js animates it (zooms/fades) whenever the student
             moves to a new question — see the "QUESTION-TO-QUESTION GALAXY
             TRANSITION" section in app.js. -->
        <div class="question-content" id="questionContent">
          <p class="prompt">Which letter did you hear?</p>

          <button id="playAudioBtn" class="audio-btn" type="button" aria-label="Play the letter sound">
            <span class="speaker-icon" aria-hidden="true">🔊</span>
            <span>Play Sound</span>
          </button>

          <!-- hidden native audio element the JS controls -->
          <audio id="letterAudio" preload="none"></audio>

          <div class="options-grid" id="optionsGrid" role="group" aria-label="Answer choices"></div>

          <p class="feedback" id="feedback" role="status"></p>
        </div>

        <div class="next-wrap">
          <button id="nextBtn" class="btn btn-secondary" style="display:none;">Next →</button>
        </div>
      </section>

      <!-- ============================================================
           RESULTS SCREEN
           ============================================================ -->
      <section id="resultsScreen" class="screen results-screen">
        <!-- Wrapped the same way as questionContent so the final
             "arrival" into the results screen gets the same galaxy
             zoom treatment as every question-to-question jump. -->
        <div class="question-content" id="resultsContent">
          <div class="results-emoji" aria-hidden="true">🎉</div>
          <h2>Great Job, Space Explorer!</h2>
          <p class="results-score" id="resultsScore">0 POINTS</p>
          <p class="results-msg" id="resultsMsg"></p>
          <div class="results-stars" id="resultsStars" aria-hidden="true"></div>
          <p class="results-best" id="resultsBest">🏆 Best: 0 POINTS</p>
          <button id="playAgainBtn" class="btn btn-primary btn-lg btn-block">🔄 Play Again</button>
        </div>
      </section>

    </div>
  </main>

  <!-- Question data lives here — edit questions.js to add/change questions -->
  <script src="questions.js"></script>
  <!-- Game logic — see comments inside for what's safe to tweak -->
  <script src="app.js"></script>
</body>
</html>
