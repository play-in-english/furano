<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>Galaxy Hub</title>

    <!-- Same font pairing as the main game (index.html / style.css):
         Baloo 2 for headings/buttons, Nunito for body text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --font-display: "Baloo 2", "Trebuchet MS", sans-serif;
            --font-body: "Nunito", "Trebuchet MS", sans-serif;

            --sky-deep: #05060f;
            --sky-navy: #0b0e2b;
            --star-gold: #ffd966;
            --comet-teal: #4fe3c1;
        }

        * {
            box-sizing: border-box;
        }

        /* NO SCROLLBARS, EVER: the page never scrolls. The fit-to-screen
           script at the bottom scales .home-base (via --fit-scale / CSS
           zoom) so it always fits the available screen. */
        html,
        body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            margin: 0;
            height: 100vh;
            height: 100svh;
            height: 100dvh;
            font-family: var(--font-body);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: max(16px, env(safe-area-inset-top))
                     max(16px, env(safe-area-inset-right))
                     max(16px, env(safe-area-inset-bottom))
                     max(16px, env(safe-area-inset-left));
        }

        /* ---------- Galaxy background: sky, nebula, twinkling stars ----------
           Same look as the main game screen (index.html / style.css), so
           the Home Base / Galaxy Hub page feels like part of the same
           galaxy rather than a plain page. */

        .sky {
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(
                    ellipse at 20% 15%,
                    rgba(124, 92, 255, 0.16),
                    transparent 55%
                ),
                radial-gradient(
                    ellipse at 82% 78%,
                    rgba(255, 111, 176, 0.12),
                    transparent 50%
                ),
                radial-gradient(
                    ellipse at 50% 100%,
                    rgba(79, 227, 193, 0.08),
                    transparent 60%
                ),
                linear-gradient(
                    180deg,
                    var(--sky-deep) 0%,
                    var(--sky-navy) 55%,
                    #0a0d2a 100%
                );
        }

        .nebula {
            position: fixed;
            inset: -10%;
            z-index: -2;
            pointer-events: none;
            background:
                radial-gradient(
                    600px 400px at 15% 25%,
                    rgba(124, 92, 255, 0.14),
                    transparent 60%
                ),
                radial-gradient(
                    500px 380px at 85% 20%,
                    rgba(255, 111, 176, 0.10),
                    transparent 60%
                ),
                radial-gradient(
                    700px 500px at 60% 90%,
                    rgba(79, 227, 193, 0.08),
                    transparent 60%
                );
            filter: blur(6px);
            animation: driftNebula 50s ease-in-out infinite alternate;
        }

        @keyframes driftNebula {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-2%, 2%) scale(1.05);
            }
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            opacity: 0.6;
            animation: twinkle linear infinite;
        }

        .star.big {
            box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
        }

        @keyframes twinkle {
            0%,
            100% {
                opacity: var(--min-o, 0.25);
                transform: scale(1);
            }

            50% {
                opacity: var(--max-o, 0.95);
                transform: scale(1.25);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .nebula,
            .star {
                animation: none;
            }
        }

        /* ---------- Galaxy Hub content ---------- */

        .home-base {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 900px;
            text-align: center;
            text-shadow:
                0 2px 14px rgba(0, 0, 0, 0.6),
                0 1px 3px rgba(0, 0, 0, 0.8);
            /* Set automatically by the fit-to-screen script. */
            zoom: var(--fit-scale, 1);
        }

        /* Planet above GALAXY HUB.
           Flex column keeps the planet centered on every screen size. */

        .galaxy-hub-title {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 48px;
            margin: 0 0 10px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;
            line-height: 1;
        }

        .galaxy-hub-title span:first-child {
            display: block;
            font-size: 1em;
            line-height: 0.9;
            margin-bottom: 6px;
        }

        .galaxy-hub-title span:last-child {
            display: block;
        }

        #welcome {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 40px;
            color: var(--star-gold);
        }

        .missions {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 25px;
        }

        .mission {
            background: rgba(20, 42, 71, 0.75);
            border: 3px solid #4cc9f0;
            border-radius: 20px;
            padding: 30px 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .mission:hover {
            transform: scale(1.05);
        }

        .mission h2 {
            font-family: var(--font-display);
            font-weight: 700;
            margin-top: 0;
        }

        .mission p {
            font-family: var(--font-body);
            font-weight: 600;
            line-height: 1.5;
        }

        .mission button {
            font-family: var(--font-display);
            font-weight: 700;
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .locked {
            opacity: 0.45;
            cursor: default;
        }

        .locked:hover {
            transform: none;
        }

        /* ---------- Responsive ---------- */

        @media (max-width: 600px) {
            .galaxy-hub-title {
                font-size: 38px;
            }
        }

        /* ======================================================
           BACKGROUND MUSIC CONTROL (bottom-left)
           ======================================================
           Fixed to the viewport, so it never adds to the page
           height and can never cause a scrollbar / drag bar.
           The button is a PLAY icon: GREEN while the music plays,
           RED while it is off. Clicking it toggles the music and
           slides out the volume bar to its right. */

        .space-music {
            position: fixed;
            left: max(14px, env(safe-area-inset-left));
            bottom: max(14px, env(safe-area-inset-bottom));
            z-index: 9999;

            display: flex;
            align-items: center;
            gap: 10px;

            max-width: calc(100vw - 28px);
            margin: 0;
            padding: 0;
        }

        .space-music-btn {
            flex: none;
            width: 62px;
            height: 62px;
            padding: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            cursor: pointer;

            background: #e63946;              /* RED = music off */
            box-shadow:
                0 0 16px rgba(230, 57, 70, 0.6),
                0 4px 14px rgba(0, 0, 0, 0.4);

            transition:
                transform 0.2s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;

            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .space-music-btn.is-playing {
            background: #22c55e;              /* GREEN = music on */
            box-shadow:
                0 0 18px rgba(34, 197, 94, 0.7),
                0 4px 14px rgba(0, 0, 0, 0.4);
        }

        .space-music-btn:hover {
            transform: scale(1.08);
        }

        .space-music-btn:active {
            transform: scale(0.95);
        }

        .space-music-btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        .space-music-btn svg {
            width: 28px;
            height: 28px;
            display: block;
            margin-left: 3px;                 /* optical centering of the triangle */
            fill: #ffffff;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
        }

        /* Volume bar: hidden until the play button is clicked. */

        .space-music-volume {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 10px 14px;
            border-radius: 999px;

            background: rgba(18, 22, 55, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);

            opacity: 0;
            transform: translateX(-10px);
            pointer-events: none;
            visibility: hidden;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease,
                visibility 0s linear 0.2s;
        }

        .space-music.show-volume .space-music-volume,
        .space-music:focus-within .space-music-volume {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
            visibility: visible;
            transition:
                opacity 0.2s ease,
                transform 0.2s ease,
                visibility 0s;
        }

        .space-music-volume-icon {
            font-size: 18px;
            line-height: 1;
        }

        .space-music-slider {
            -webkit-appearance: none;
            appearance: none;
            width: clamp(90px, 28vw, 150px);
            height: 8px;
            margin: 0;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            touch-action: none;

            /* --vol (0-100) is set by the script to paint the fill. */
            background: linear-gradient(
                to right,
                var(--comet-teal) 0%,
                var(--comet-teal) var(--vol, 80%),
                rgba(255, 255, 255, 0.25) var(--vol, 80%),
                rgba(255, 255, 255, 0.25) 100%
            );
        }

        .space-music-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--comet-teal);
            box-shadow: 0 0 8px rgba(79, 227, 193, 0.7);
        }

        .space-music-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--comet-teal);
            box-shadow: 0 0 8px rgba(79, 227, 193, 0.7);
        }

        .space-music-slider:focus-visible {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.6);
        }

        .space-music-percent {
            min-width: 2.6em;
            text-align: right;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 14px;
            color: #fff;
        }

        @media (prefers-reduced-motion: reduce) {
            .space-music-btn,
            .space-music-volume {
                transition: none;
            }
        }
    </style>
</head>

<body>

<div class="sky"></div>
<div class="nebula"></div>
<div class="stars" id="starField" aria-hidden="true"></div>

<div class="home-base">

    <h1 class="galaxy-hub-title">
        <span>🪐</span>
        <span>GALAXY HUB</span>
    </h1>

    <div id="welcome"></div>

    <div class="missions">

        <!-- Mission 1 -->
        <div class="mission" onclick="startMission1()">
            <h2>📢 Sounds from S.P.A.C.E.!</h2>
            <p>
                宇宙から聞こえる、未知の音。<br>
                この音は、何だろう？
            </p>
            <button>START</button>
        </div>

        <!-- Future Word Hunter -->
        <div class="mission locked">
            <h2>🌠 SHOOT 'N SPELL</h2>
            <p>
                宇宙に散らばったアルファベット。<br>
                正しい文字を、シュート！
            </p>
            <button>COMING SOON</button>
        </div>

    </div>

</div>

<!-- Welcome audio (shared with index.html). Plays at most once per
     visit: skipped automatically if it already played on GALAXY
     CHECK-IN or earlier in this session. -->
<script src="welcome-audio.js"></script>

<script>

    // Get the nickname saved during login
    const nickname = sessionStorage.getItem("playerNickname");

    // If there is no nickname, send the player back to login
    if (!nickname) {
        window.location.href = "index.html";
    } else {
        document.getElementById("welcome").textContent =
            "Choose your mission, " + nickname + "!";

        // Arriving at the GALAXY HUB: plays spaceship-welcome.mp3 for the
        // first check-in of the day, or spaceship-welcomeback.mp3 for
        // returning players. Once per visit (no-op if already played).
        if (window.WelcomeAudio) {
            window.WelcomeAudio.playHubGreeting();
        }
    }

    // Mission 1
    function startMission1() {
        sessionStorage.setItem("launchMission1", "true");
        window.location.href = "index.html";
    }

    // Twinkling star field — same generation approach as the main
    // game's buildStarField() in app.js, kept small/self-contained
    // here since this page doesn't load app.js.
    (function buildStarField() {

        const starField = document.getElementById("starField");

        if (!starField) {
            return;
        }

        const STAR_COUNT = 90;
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < STAR_COUNT; i++) {

            const star = document.createElement("div");

            const size =
                Math.random() < 0.15
                    ? Math.random() * 2 + 2.5
                    : Math.random() * 1.5 + 1;

            star.className = size > 3
                ? "star big"
                : "star";

            star.style.left = `${Math.random() * 100}vw`;
            star.style.top = `${Math.random() * 100}vh`;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;

            star.style.animationDuration =
                `${(Math.random() * 3 + 2.5).toFixed(2)}s`;

            star.style.animationDelay =
                `${(Math.random() * 4).toFixed(2)}s`;

            star.style.setProperty(
                "--min-o",
                (Math.random() * 0.25 + 0.1).toFixed(2)
            );

            star.style.setProperty(
                "--max-o",
                (Math.random() * 0.4 + 0.6).toFixed(2)
            );

            fragment.appendChild(star);
        }

        starField.appendChild(fragment);

    })();

    // Button click sound — same square-wave "zap" synthesis as
    // playClickSound() in app.js, kept self-contained here since
    // this page doesn't load app.js. Applies to every button on
    // this page (currently: START / COMING SOON).
    let clickSoundCtx = null;

    function playClickSound() {

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContextClass) {
            return;
        }

        if (!clickSoundCtx) {
            clickSoundCtx = new AudioContextClass();
        }

        if (clickSoundCtx.state === "suspended") {
            clickSoundCtx.resume();
        }

        const now = clickSoundCtx.currentTime;

        const osc = clickSoundCtx.createOscillator();
        const gain = clickSoundCtx.createGain();

        osc.type = "square";

        osc.frequency.setValueAtTime(1100, now);
        osc.frequency.exponentialRampToValueAtTime(
            120,
            now + 0.15
        );

        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(
            0.001,
            now + 0.16
        );

        osc.connect(gain);
        gain.connect(clickSoundCtx.destination);

        osc.start(now);
        osc.stop(now + 0.18);
    }

   document.addEventListener(
    "click",
    event => {

        const button = event.target.closest("button");

        if (button && !button.disabled) {
            playClickSound();
        }

    },
    true
);

    // Fit to screen — no scrollbars on any device. Scales .home-base
    // (CSS zoom via --fit-scale) so it always fits the available space.
    (function () {

        const box = document.querySelector(".home-base");
        let raf = null;

        if (!box) {
            return;
        }

        function fit() {

            const cs = getComputedStyle(document.body);

            const availH =
                document.body.clientHeight -
                parseFloat(cs.paddingTop) -
                parseFloat(cs.paddingBottom) -
                12;

            if (availH <= 0) {
                return;
            }

            let scale = 1;
            box.style.setProperty("--fit-scale", "1");

            for (let i = 0; i < 6; i++) {

                const h = box.getBoundingClientRect().height;

                if (h <= 0) {
                    return;
                }

                const ratio = availH / h;

                if (ratio < 0.995 || (scale < 1 && ratio > 1.01)) {
                    scale = Math.max(0.25, Math.min(1, scale * ratio * 0.995));
                    box.style.setProperty("--fit-scale", scale.toFixed(4));
                } else {
                    break;
                }
            }
        }

        function schedule() {

            if (raf !== null) {
                return;
            }

            raf = requestAnimationFrame(() => {
                raf = null;
                fit();
            });
        }

        if (window.ResizeObserver) {
            new ResizeObserver(schedule).observe(box);
        }

        window.addEventListener("resize", schedule);
        window.addEventListener("orientationchange", schedule);

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(schedule);
        }

        schedule();

    })();

</script>

<!-- ======================================================
     GALAXY HUB — BACKGROUND MUSIC
     ====================================================== -->

<audio
  id="spaceBgMusic"
  src="audio/space-bg.mp3"
  loop
  preload="auto"
></audio>

<div class="space-music" id="spaceMusic">

  <button
    id="spaceMusicBtn"
    class="space-music-btn"
    type="button"
    aria-label="Turn background music on"
    title="Turn background music on"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 6 3.5z"></path>
    </svg>
  </button>

  <div class="space-music-volume" id="spaceMusicVolume">
    <span class="space-music-volume-icon" aria-hidden="true">🔉</span>
    <input
      id="spaceMusicSlider"
      class="space-music-slider"
      type="range"
      min="0"
      max="100"
      step="1"
      value="80"
      aria-label="Background music volume"
    >
    <span class="space-music-percent" id="spaceMusicPercent">80%</span>
  </div>

</div>

<script>
/* ======================================================
   GALAXY HUB — BACKGROUND MUSIC
   ======================================================
   - Starts automatically for EVERY player (first check-in and
     returning). If the browser blocks autoplay, it starts on the
     player's first tap / key press instead.
   - Stays on until the player turns it off with the play button
     (the "off" choice is remembered for this visit only).
   - Play button: GREEN = playing, RED = off. Clicking it toggles
     the music and shows the volume bar.
   - Volume is remembered on this device. */

(function () {

    const music = document.getElementById("spaceBgMusic");
    const wrap = document.getElementById("spaceMusic");
    const btn = document.getElementById("spaceMusicBtn");
    const slider = document.getElementById("spaceMusicSlider");
    const percent = document.getElementById("spaceMusicPercent");

    const VOLUME_KEY = "galaxyAlphabetQuiz.bgmVolume.v1";
    const OFF_KEY = "galaxyAlphabetQuiz.bgmOff.v1";
    const DEFAULT_VOLUME = 0.8;      // was 0.15 (too soft)
    const VOLUME_BAR_HIDE_MS = 4000;

    let hideTimer = null;

    /* ---------- safe storage ---------- */

    function lsGet(key) {
        try { return localStorage.getItem(key); }
        catch (e) { return null; }
    }

    function lsSet(key, value) {
        try { localStorage.setItem(key, value); }
        catch (e) { /* ignore */ }
    }

    function ssGet(key) {
        try { return sessionStorage.getItem(key); }
        catch (e) { return null; }
    }

    function ssSet(key, value) {
        try { sessionStorage.setItem(key, value); }
        catch (e) { /* ignore */ }
    }

    function ssRemove(key) {
        try { sessionStorage.removeItem(key); }
        catch (e) { /* ignore */ }
    }

    /* ---------- volume ---------- */

    function applyVolume(vol01, save) {

        const v = Math.min(1, Math.max(0, vol01));
        const pct = Math.round(v * 100);

        music.volume = v;
        slider.value = String(pct);
        slider.style.setProperty("--vol", pct + "%");
        percent.textContent = pct + "%";

        if (save) {
            lsSet(VOLUME_KEY, String(v));
        }
    }

    const savedVolume = parseFloat(lsGet(VOLUME_KEY));

    applyVolume(
        isFinite(savedVolume) ? savedVolume : DEFAULT_VOLUME,
        false
    );

    slider.addEventListener("input", () => {
        applyVolume(slider.value / 100, true);
        showVolumeBar();
    });

    /* ---------- volume bar show / hide ---------- */

    function showVolumeBar() {

        wrap.classList.add("show-volume");

        clearTimeout(hideTimer);

        hideTimer = setTimeout(hideVolumeBar, VOLUME_BAR_HIDE_MS);
    }

    function hideVolumeBar() {

        clearTimeout(hideTimer);

        // Don't hide while the slider is being used with the keyboard.
        if (wrap.contains(document.activeElement) &&
            document.activeElement === slider) {
            document.activeElement.blur();
        }

        wrap.classList.remove("show-volume");
    }

    // Tapping anywhere else closes the volume bar.
    document.addEventListener("pointerdown", event => {
        if (!wrap.contains(event.target)) {
            hideVolumeBar();
        }
    });

    wrap.addEventListener("pointerdown", () => {
        if (wrap.classList.contains("show-volume")) {
            showVolumeBar();
        }
    });

    /* ---------- button look: GREEN = playing, RED = off ---------- */

    function updateButton() {

        const playing = !music.paused;

        btn.classList.toggle("is-playing", playing);

        const label = playing
            ? "Turn background music off"
            : "Turn background music on";

        btn.setAttribute("aria-label", label);
        btn.setAttribute("title", label);
    }

    music.addEventListener("playing", updateButton);
    music.addEventListener("play", updateButton);
    music.addEventListener("pause", updateButton);

    /* ---------- play / pause ---------- */

    function startMusic() {

        const p = music.play();

        if (p && typeof p.then === "function") {
            p.then(updateButton).catch(() => {
                // Autoplay blocked: wait for the first tap / key press.
                updateButton();
                armFirstGestureStart();
            });
        }
    }

    // Autoplay fallback. Ignores taps on the music control itself
    // (that button already decides what to do).
    let gestureArmed = false;

    function armFirstGestureStart() {

        if (gestureArmed) {
            return;
        }

        gestureArmed = true;

        const handler = event => {

            if (event.target && wrap.contains(event.target)) {
                return;
            }

            document.removeEventListener("pointerdown", handler, true);
            document.removeEventListener("keydown", handler, true);
            gestureArmed = false;

            if (music.paused && ssGet(OFF_KEY) !== "true") {
                startMusic();
            }
        };

        document.addEventListener("pointerdown", handler, true);
        document.addEventListener("keydown", handler, true);
    }

    btn.addEventListener("click", () => {

        if (music.paused) {

            ssRemove(OFF_KEY);
            startMusic();

        } else {

            ssSet(OFF_KEY, "true");
            music.pause();
            updateButton();
        }

        showVolumeBar();
    });

    /* ---------- auto-start when the Galaxy Hub opens ---------- */

    function autoStart() {

        if (ssGet(OFF_KEY) === "true") {
            updateButton();
            return;
        }

        startMusic();
    }

    if (document.readyState === "complete") {
        autoStart();
    } else {
        window.addEventListener("load", autoStart);
    }

    updateButton();

})();
</script>

</body>
</html>
