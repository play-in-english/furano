<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Base</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #081426;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-base {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        #welcome {
            font-size: 24px;
            margin-bottom: 40px;
        }

        .missions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .mission {
            background: #142a47;
            border: 3px solid #4cc9f0;
            border-radius: 20px;
            padding: 30px 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .mission:hover {
            transform: scale(1.05);
        }

        .mission h2 {
            margin-top: 0;
        }

        .mission button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .locked {
            opacity: 0.45;
            cursor: default;
        }

        .locked:hover {
            transform: none;
        }
    </style>
</head>

<body>

<div class="home-base">

    <h1>🚀 HOME BASE</h1>

    <div id="welcome"></div>

    <div class="missions">

        <!-- Mission 1 -->
        <div class="mission" onclick="startMission1()">
            <h2>MISSION 1</h2>
            <p>Complete the original English game.</p>
            <button>START</button>
        </div>

        <!-- Future Word Hunter -->
        <div class="mission locked">
            <h2>MISSION 2</h2>
            <p>WORD HUNTER</p>
            <button>COMING SOON</button>
        </div>

    </div>

</div>

<script>

    // Get the nickname saved during login
    const nickname = sessionStorage.getItem("playerNickname");

    // If there is no nickname, send the player back to login
    if (!nickname) {
        window.location.href = "index.html";
    } else {
        document.getElementById("welcome").textContent =
            "Welcome, " + nickname + "!";
    }

    // Mission 1
   function startMission1() {
    sessionStorage.setItem("launchMission1", "true");
    window.location.href = "index.html";
}

</script>

</body>
</html>
